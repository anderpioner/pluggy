          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Periodicidade</label>
              <select value={periodicidade} onChange={e => setPeriodicidade(e.target.value)}>
                <option value="">Não paga renda</option>
                <option value="Mensal">Mensal</option>
                <option value="Bimestral">Bimestral</option>
                <option value="Trimestral">Trimestral</option>
                <option value="Semestral">Semestral</option>
                <option value="Anual">Anual</option>
                <option value="Sob demanda">Sob demanda</option>
              </select>
            </div>
            <div className="aform-field">
              <label className="aform-label">DY (%)</label>
              <input type="number" step="0.01" min="0" value={dy}
                onChange={e => setDy(e.target.value)} placeholder="Ex: 12.5"
                disabled={!periodicidade} />
            </div>
          </div>
          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Data do Pagamento</label>
              <input type="date" value={dataPagamento}
                onChange={e => setDataPagamento(e.target.value)}
                disabled={!periodicidade} />
            </div>

function generateDatesJS(startDateStr, endDateStr, periodicity) {
  if (!startDateStr) return [];
  if (periodicity === 'Único') {
    return [startDateStr];
  }
  if (!endDateStr) return [];
  const startParts = startDateStr.split('-');
  const endParts = endDateStr.split('-');
  if (startParts.length !== 3 || endParts.length !== 3) return [];

  const startYear = parseInt(startParts[0], 10);
  const startMonth = parseInt(startParts[1], 10); // 1-indexed
  const startDay = parseInt(startParts[2], 10);

  const endYear = parseInt(endParts[0], 10);
  const endMonth = parseInt(endParts[1], 10); // 1-indexed
  const endDay = parseInt(endParts[2], 10);

  const startDate = new Date(startYear, startMonth - 1, startDay);
  const endDate = new Date(endYear, endMonth - 1, endDay);

  if (startDate > endDate) return [];

  const stepMonths = {
    'Mensal': 1,
    'Bimestral': 2,
    'Trimestral': 3,
    'Semestral': 6,
    'Anual': 12
  }[periodicity] || 1;

  const dates = [];
  let currYear = startYear;
  let currMonth = startMonth; // 1-indexed

  let iterations = 0;
  while (iterations < 1000) {
    iterations++;
    const maxDay = new Date(currYear, currMonth, 0).getDate();
    const currDay = Math.min(startDay, maxDay);
    const currDate = new Date(currYear, currMonth - 1, currDay);

    if (currDate > endDate) break;

    const yStr = String(currYear).padStart(4, '0');
    const mStr = String(currMonth).padStart(2, '0');
    const dStr = String(currDay).padStart(2, '0');
    dates.push(`${yStr}-${mStr}-${dStr}`);

    currMonth += stepMonths;
    if (currMonth > 12) {
      currYear += Math.floor((currMonth - 1) / 12);
      currMonth = ((currMonth - 1) % 12) + 1;
    }
  }

  return dates;
}

function CashflowModal({ asset, onClose }) {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [series, setSeries] = useState([]);

  useEffect(() => {
    async function load() {
      try {
        const r = await fetch(`/api/portfolio/${asset.id}/cashflows`);
        const d = await r.json();
        if (d.series) {
          setSeries(d.series.map(s => ({ ...s, id: s.id || Math.random() + Date.now() })));
        }
      } catch (e) {
        console.error(e);
      } finally {
        setLoading(false);
      }
    }
    load();
  }, [asset.id]);

  const updateRow = (id, field, value) => {
    setSeries(prev => prev.map(s => {
      if (s.id !== id) return s;
      let next = { ...s, [field]: value };
      if (field === 'periodicity' && value === 'Único') {
        next.end_date = next.start_date;
      }
      if (field === 'start_date' && next.periodicity === 'Único') {
        next.end_date = value;
      }
      return next;
    }));
  };

  const removeRow = (id) => {
    setSeries(prev => prev.filter(s => s.id !== id));
  };

  const addRow = (type) => {
    setSeries(prev => [
      ...prev,
      {
        id: Math.random() + Date.now(),
        type,
        start_date: todayStr(),
        end_date: todayStr(),
        periodicity: 'Único'
      }
    ]);
  };

  const jurosDates = useMemo(() => {
    const datesSet = new Set();
    series.filter(s => s.type === 'JUROS').forEach(s => {
      generateDatesJS(s.start_date, s.end_date, s.periodicity).forEach(d => datesSet.add(d));
    });
    return Array.from(datesSet).sort();
  }, [series]);

  const amortizacaoDates = useMemo(() => {
    const datesSet = new Set();
    series.filter(s => s.type === 'AMORTIZACAO').forEach(s => {
      generateDatesJS(s.start_date, s.end_date, s.periodicity).forEach(d => datesSet.add(d));
    });
    return Array.from(datesSet).sort();
  }, [series]);

  async function handleSave() {
    setSaving(true);
    try {
      for (const s of series) {
        if (!s.start_date) {
          alert('Todas as séries devem ter uma Data de Início definida.');
          setSaving(false);
          return;
        }
        if (s.periodicity !== 'Único' && !s.end_date) {
          alert('Todas as séries recorrentes devem ter uma Data de Fim definida.');
          setSaving(false);
          return;
        }
        if (s.periodicity !== 'Único' && s.start_date > s.end_date) {
          alert('A Data de Início não pode ser posterior à Data de Fim.');
          setSaving(false);
          return;
        }
      }

      const payload = {
        series: series.map(s => ({
          type: s.type,
          start_date: s.start_date,
          end_date: s.periodicity === 'Único' ? s.start_date : s.end_date,
          periodicity: s.periodicity
        }))
      };

      const r = await fetch(`/api/portfolio/${asset.id}/cashflows`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (r.ok) {
        onClose();
      } else {
        const d = await r.json();
        alert(d.error || 'Erro ao salvar fluxo de caixa');
      }
    } catch (e) {
      alert(e.message);
    } finally {
      setSaving(false);
    }
  }

  function formatToBR(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  const renderSection = (type, title) => {
    const list = series.filter(s => s.type === type);
    return (
      <div style={{marginBottom:24}}>
        <div className="aform-section-title" style={{marginBottom:12}}>{title}</div>
        {list.length === 0 ? (
          <div style={{fontSize:12,color:'var(--muted)',fontFamily:'var(--mono)',padding:'10px 0'}}>Nenhuma série configurada.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {list.map(s => (
              <div key={s.id} style={{display:'flex',gap:8,alignItems:'center'}}>
                <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                  <div className="aform-field">
                    <label className="aform-label" style={{fontSize:8}}>Início</label>
                    <input type="date" value={s.start_date} onChange={e => updateRow(s.id, 'start_date', e.target.value)} />
                  </div>
                  <div className="aform-field">
                    <label className="aform-label" style={{fontSize:8}}>Fim</label>
                    <input type="date" value={s.end_date} onChange={e => updateRow(s.id, 'end_date', e.target.value)} disabled={s.periodicity === 'Único'} />
                  </div>
                  <div className="aform-field">
                    <label className="aform-label" style={{fontSize:8}}>Período</label>
                    <select value={s.periodicity} onChange={e => updateRow(s.id, 'periodicity', e.target.value)}>
                      <option value="Único">Único</option>
                      <option value="Mensal">Mensal</option>
                      <option value="Bimestral">Bimestral</option>
                      <option value="Trimestral">Trimestral</option>
                      <option value="Semestral">Semestral</option>
                      <option value="Anual">Anual</option>
                    </select>
                  </div>
                </div>
                <button className="ativo-btn danger" style={{alignSelf:'flex-end',height:32,display:'flex',alignItems:'center'}} onClick={() => removeRow(s.id)}>✕</button>
              </div>
            ))}
          </div>
        )}
        <button className="ativo-btn" style={{marginTop:8}} onClick={() => addRow(type)}>+ Adicionar Série</button>
      </div>
    );
  };

  return (
    <div className="aform-overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="aform-box" style={{width:800,maxWidth:'95%'}}>
        <div className="aform-hdr">
          <span className="aform-title">Fluxo de Caixa: {asset.name}</span>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="aform-body" style={{maxHeight:'70vh'}}>
          {loading ? (
            <div style={{color:'var(--muted)',fontSize:12,fontFamily:'var(--mono)',padding:'20px 0',textAlign:'center'}}>Carregando…</div>
          ) : (
            <>
              <div style={{fontSize:11,color:'var(--muted)',lineHeight:'1.4',background:'rgba(255,255,255,.02)',padding:'8px 12px',borderRadius:4,border:'1px solid var(--border)'}}>
                Configure as séries temporais de Juros e Amortização. Apenas a modelagem das datas está ativa (valores não são definidos nesta etapa).
              </div>

              {renderSection('JUROS', '1. Juros')}
              {renderSection('AMORTIZACAO', '2. Amortização')}

              <div className="aform-section-title" style={{marginBottom:10}}>Resultado da Modelagem (Soma das Séries)</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,background:'rgba(0,0,0,.15)',padding:12,borderRadius:6,border:'1px solid var(--border)'}}>
                <div>
                  <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--accent)',fontWeight:700,marginBottom:6}}>DATAS DE JUROS ({jurosDates.length})</div>

                  ) : (

  );

    const esc = v => {
      const s = v == null ? '' : String(v);
      return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g, '""')}"` : s;

      'Valor Atual','Valor Investido','Rentab. %','Taxa a.a. %',
      'Período','DY %','Data Pgto','Liquidez','Titular','Status'];

    const allSame = (items, field) => items.every(i => (i[field] ?? '') === (items[0][field] ?? ''));

    const rows = grouped.flatMap(g => {
      if (!g.key || g.items.length === 1) {

          a.name, 1, a.renda_tipo === 'FIXA' ? 'Fixa' : 'Variável',

          fmtDate(a.vencimento),

          rentab != null ? fmtNum(rentab) : '',
          a.annual_rate != null ? fmtNum(a.annual_rate) : '',
          a.periodicidade || 'não paga', a.dy != null ? fmtNum(a.dy) : '',
          fmtDate(a.data_pagamento),
          a.liquidez ? 'Sim' : 'Não',
          firstName(a.owner) || '', a.status || '',
        ]];

      const gBalance = g.items.reduce((s, i) => s + (i.balance || 0), 0);
      const gAmount  = g.items.reduce((s, i) => s + (i.amount  || 0), 0);
      const gRentab  = gAmount > 0 ? ((gBalance - gAmount) / gAmount * 100) : null;
      return [[
        rep.name, g.items.length, rep.renda_tipo === 'FIXA' ? 'Fixa' : 'Variável',
        allSame(g.items, 'indexador')   ? (rep.indexador || '') : '(variado)',
        allSame(g.items, 'subtype')     ? (SUBTYPES_LABELS[rep.subtype] || rep.subtype || '') : '(variado)',

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:5,padding:'10px 16px',minWidth:160}}>
          <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1.2,marginBottom:4,fontFamily:'var(--mono)'}}>Renda Fixa</div>
          <div style={{fontSize:17,fontFamily:'var(--mono)',fontWeight:700,color:'#00d4aa'}}>{fmt(fixaBalance)}</div>
        </div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:5,padding:'10px 16px',minWidth:160}}>
          <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1.2,marginBottom:4,fontFamily:'var(--mono)'}}>Renda Variável</div>
          <div style={{fontSize:17,fontFamily:'var(--mono)',fontWeight:700,color:'#4a90d9'}}>{fmt(varBalance)}</div>
        </div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:5,padding:'10px 16px',minWidth:160}}>
          <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1.2,marginBottom:4,fontFamily:'var(--mono)'}}>◆ Com Liquidez</div>
          <div style={{fontSize:17,fontFamily:'var(--mono)',fontWeight:700,color:'#00d4aa'}}>{fmt(liquidezBalance)}</div>
        </div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:5,padding:'10px 16px',minWidth:130}}>
          <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1.2,marginBottom:4,fontFamily:'var(--mono)'}}>Ativos</div>

      {msg && (
        <div style={{background:'rgba(0,212,170,.1)',border:'1px solid rgba(0,212,170,.3)',borderRadius:5,padding:'8px 14px',fontSize:12,color:'#00d4aa',display:'flex',justifyContent:'space-between',alignItems:'center'}}>

      {/* Sub-tabs */}
      <div style={{display:'flex',alignItems:'center',gap:12}}>

              <option value="FIXA">Renda Fixa</option>
              <option value="VARIAVEL">Renda Variável</option>

            <div className="ativos-tbl-wrap">
              <table>
                <thead>
                  <tr>
                    <th className={`sortable${sortField==='name'?' sorted':''}`} onClick={() => onSort('name')}>Nome{arrow('name')}</th>
                    <th style={{width:76,textAlign:'center',fontSize:9,color:'var(--muted)',fontFamily:'var(--mono)',textTransform:'uppercase',letterSpacing:1}}>Sync</th>
                    <th className={`sortable${sortField==='renda_tipo'?' sorted':''}`} onClick={() => onSort('renda_tipo')}>Renda{arrow('renda_tipo')}</th>
                    <th className={`sortable${sortField==='indexador'?' sorted':''}`} onClick={() => onSort('indexador')}>Indexador{arrow('indexador')}</th>
                    <th className={`sortable${sortField==='subtype'?' sorted':''}`} onClick={() => onSort('subtype')}>Subtipo{arrow('subtype')}</th>
                    <th className={`sortable${sortField==='vencimento'?' sorted':''}`} onClick={() => onSort('vencimento')}>Vencimento{arrow('vencimento')}</th>
                    <th className={`sortable${sortField==='balance'?' sorted':''}`} onClick={() => onSort('balance')} style={{textAlign:'right'}}>Valor Atual{arrow('balance')}</th>
                    <th className={`sortable${sortField==='amount'?' sorted':''}`} onClick={() => onSort('amount')} style={{textAlign:'right'}}>Valor Invest.{arrow('amount')}</th>
                    <th className={`sortable${sortField==='annual_rate'?' sorted':''}`} onClick={() => onSort('annual_rate')} style={{textAlign:'right'}}>Taxa a.a.{arrow('annual_rate')}</th>
                    <th className={`sortable${sortField==='periodicidade'?' sorted':''}`} onClick={() => onSort('periodicidade')}>Período{arrow('periodicidade')}</th>
                    <th className={`sortable${sortField==='dy'?' sorted':''}`} onClick={() => onSort('dy')} style={{textAlign:'right'}}>DY{arrow('dy')}</th>
                    <th className={`sortable${sortField==='data_pagamento'?' sorted':''}`} onClick={() => onSort('data_pagamento')}>Pgto{arrow('data_pagamento')}</th>

                            {a.pluggy_last_date && (
                              <span title={`Valores sincronizados do Pluggy · ${fmtDate(a.pluggy_last_date)}`}

                                ⟳ Pluggy

                          <td><span className={`ativo-badge ${a.renda_tipo}`}>{a.renda_tipo === 'FIXA' ? 'Fixa' : 'Variável'}</span></td>

                          <td style={{fontSize:11,color:'var(--muted)'}}>{SUBTYPES_LABELS[a.subtype] || a.subtype || '—'}</td>
                          <td style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)',whiteSpace:'nowrap'}}>

                          <td style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color: a.dy != null ? 'var(--green)' : 'var(--muted)'}}>

                          <td style={{fontSize:11,color:'var(--muted)',whiteSpace:'nowrap'}}>{a.data_pagamento ? new Date(a.data_pagamento+'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>

                              className={`ativo-liq-btn${a.liquidez ? ' on' : ''}`}

                            </button>
                          </td>
                          <td style={{fontSize:11,color:'var(--muted)'}}>{firstName(a.owner) || '—'}</td>

                          <td>
                            <div className="ativo-actions">
                              <button className="ativo-btn" onClick={() => setCashflowAsset(a)} title="Configurar Fluxo de Caixa">Fluxo</button>
                              <button className="ativo-btn" onClick={() => setModal({ mode: 'edit', initial: a })}>Editar</button>
                              <button className="ativo-btn danger" onClick={() => handleDelete(a.id)}>✕</button>
                            </div>
                          </td>
                        </tr>
                      );
                    };

                    // Sem agrupamento ou grupo com item único: linha plana
                    if (!g.key || g.items.length === 1) return g.items.map(a => renderRow(a, false));

                    // Múltiplos ativos idênticos: linha-resumo accordion
                    const isOpen       = expandedGroups.has(g.key);
                    const rep          = g.items[0]; // item representativo para campos fixos
                    const gBalance     = g.items.reduce((s, i) => s + (i.balance || 0), 0);
                    const gAmount      = g.items.reduce((s, i) => s + (i.amount  || 0), 0);
                    const gRentab      = gAmount > 0 ? ((gBalance - gAmount) / gAmount * 100) : null;
                    const uniqueOwners = [...new Set(g.items.map(i => firstName(i.owner)).filter(Boolean))].join(', ') || '—';
                    const allSame = field => g.items.every(i => (i[field] ?? '') === (g.items[0][field] ?? ''));
                    const gPeriod  = allSame('periodicidade')  ? (rep.periodicidade || 'não paga') : null;
                    const gDy      = allSame('dy')             ? rep.dy                            : null;
                    const gPgto    = allSame('data_pagamento') ? rep.data_pagamento                : null;
                    const gLiquidez= allSame('liquidez')       ? rep.liquidez                     : null;

                    const toggle = e => {
                      e.stopPropagation();
                      setExpandedGroups(prev => {
                        const next = new Set(prev);
                        next.has(g.key) ? next.delete(g.key) : next.add(g.key);
                        return next;
                      });
                    };

                    return [
                      <tr key={`g-${g.key}`} className="ativo-group-hdr" onClick={toggle}>
                        <td>
                          <div style={{fontWeight:600,color:'var(--text)',display:'flex',alignItems:'center',gap:6}}>
                            {rep.name}
                            <span className="ativo-group-chip">{g.items.length}× {isOpen ? '▼' : '▶'}</span>
                          </div>
                          {rep.institution && <div style={{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)'}}>{rep.institution}</div>}
                        </td>
                        <td style={{textAlign:'center'}}>
                          {rep.pluggy_last_date && (
                            <span title={`Valores sincronizados do Pluggy · ${fmtDate(rep.pluggy_last_date)}`}
                              style={{fontSize:9,background:'rgba(0,212,170,.15)',color:'#00d4aa',border:'1px solid rgba(0,212,170,.3)',borderRadius:4,padding:'1px 5px',fontFamily:'var(--mono)',fontWeight:700,cursor:'default',whiteSpace:'nowrap'}}>
                              ⟳ Pluggy
                            </span>
                          )}
                        </td>
                        <td><span className={`ativo-badge ${rep.renda_tipo}`}>{rep.renda_tipo === 'FIXA' ? 'Fixa' : 'Variável'}</span></td>
                        <td style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}}>{rep.indexador || '—'}</td>
                        <td style={{fontSize:11,color:'var(--muted)'}}>{SUBTYPES_LABELS[rep.subtype] || rep.subtype || '—'}</td>
                        <td style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)',whiteSpace:'nowrap'}}>
                          {rep.vencimento ? new Date(rep.vencimento + 'T12:00:00').toLocaleDateString('pt-BR') : '—'}
                        </td>
                        <td style={{textAlign:'right',fontFamily:'var(--mono)',fontWeight:600,color:'var(--text)'}}>{fmt(gBalance)}</td>
                        <td style={{textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)'}}>{fmt(gAmount)}</td>
                        <td style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color: gRentab != null ? (gRentab >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--muted)'}}>
                          {gRentab != null ? `${gRentab >= 0 ? '+' : ''}${gRentab.toFixed(2)}%` : '—'}
                        </td>
                        <td style={{fontSize:11,color:'var(--muted)',whiteSpace:'nowrap'}}>{gPeriod ?? '—'}</td>
                        <td style={{textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color: gDy != null ? 'var(--green)' : 'var(--muted)'}}>
                          {gDy != null ? `${parseFloat(gDy).toFixed(2)}%` : '—'}
                        </td>
                        <td style={{fontSize:11,color:'var(--muted)',whiteSpace:'nowrap'}}>{gPgto ? new Date(gPgto+'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>
                        <td style={{textAlign:'center',fontSize:15,color: gLiquidez ? '#00d4aa' : 'var(--border2)'}}>
                          {gLiquidez === null ? '—' : gLiquidez ? '◆' : '◇'}
                        </td>
                        <td style={{fontSize:11,color:'var(--muted)'}}>{uniqueOwners}</td>
                        <td />
                        <td />
                      </tr>,
                      ...(isOpen ? g.items.map(a => renderRow(a, true)) : []),
                    ];
                  })}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}

      {/* Importar tab */}
      {subTab === 'importar' && (
        <>
          {loadingP ? (
            <div style={{color:'var(--muted)',fontSize:12,fontFamily:'var(--mono)',padding:'20px 0'}}>Carregando investimentos do Pluggy…</div>
          ) : dedupedPending.length === 0 ? (
            <div style={{textAlign:'center',padding:'48px 0',color:'var(--muted)',fontSize:12,fontFamily:'var(--mono)'}}>
              Nenhum investimento ativo encontrado no Pluggy. Faça um sync primeiro.
            </div>
          ) : (
            <>
              <div style={{fontSize:11,color:'var(--muted)',fontFamily:'var(--mono)'}}>
                {dedupedPending.filter(p => !p.already_imported).length} disponíveis para importar ·{' '}
                {dedupedPending.filter(p => p.already_imported).length} já na carteira
              </div>
              <div className="import-list">
                {dedupedPending.map(inv => (
                  <div key={inv.id} className={`import-card${inv.already_imported ? ' done' : ''}`}>
                    <div className="import-card-info">
                      <div className="import-card-name">{inv.name}</div>
                      <div className="import-card-meta">
                        {inv.institution} · {inv.subtype || inv.type} · {fmt(inv.balance)}
                        {inv.due_date ? ` · vence ${new Date(inv.due_date.substring(0,10) + 'T12:00:00').toLocaleDateString('pt-BR')}` : ''}
                        {inv.owner ? ` · ${firstName(inv.owner)}` : ''}
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      {inv.already_imported ? (
                        <span className="ativo-badge imported">✓ Já na carteira</span>
                      ) : (
                        <button className="ativo-btn primary" onClick={() => setModal({ mode: 'import', pluggyInv: inv })}>
                          Importar
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}
        </>
      )}

      {modal && (
        <AtivoFormModal
          mode={modal.mode}
          initial={modal.initial}
          pluggyInv={modal.pluggyInv}
          onSave={handleSave}
          onClose={() => setModal(null)}
        />
      )}

      {cashflowAsset && (
        <CashflowModal
          asset={cashflowAsset}
          onClose={() => setCashflowAsset(null)}
        />
      )}
    </div>
  );
}

/* ── App ── */
function App() {
  const [accounts,     setAccounts]     = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [loading,      setLoading]      = useState(false);
  const [syncing,      setSyncing]      = useState(false);
  const [error,        setError]        = useState(null);
  const [notice,       setNotice]       = useState(null);
  const [syncStatus,   setSyncStatus]   = useState(null);

  const [allTags,    setAllTags]    = useState([]);
  const [allConjuntos, setAllConjuntos] = useState([]);
  const [syncKey,    setSyncKey]    = useState(0);
  const today = new Date();
  const [view,       setView]       = useState('calendar');
  const [calYear,    setCalYear]    = useState(today.getFullYear());
  const [calMonth,   setCalMonth]   = useState(today.getMonth());
  const [customInterval, setCustomInterval] = useState(false);
  const [customDateFrom, setCustomDateFrom] = useState(monthStart());
  const [customDateTo,   setCustomDateTo]   = useState(todayStr());

  const mm = String(calMonth + 1).padStart(2, '0');
  const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  const calDateFrom = `${calYear}-${mm}-01`;
  const calDateTo   = `${calYear}-${mm}-${String(lastDay).padStart(2, '0')}`;

  const dateFrom = customInterval ? customDateFrom : calDateFrom;
  const dateTo   = customInterval ? customDateTo   : calDateTo;

  const [selAcc,     setSelAcc]     = useState('');
  const [selCat,     setSelCat]     = useState('');
  const [search,     setSearch]     = useState('');
  const [minAmount,  setMinAmount]  = useState('');
  const [maxAmount,  setMaxAmount]  = useState('');
  const [sortField,  setSortField]  = useState('date');
  const [sortDir,    setSortDir]    = useState('desc');
  const [hideRendeFacil, setHideRendeFacil] = useState(() => {
    const v = localStorage.getItem('cal_hideRendeFacil');
    return v === null ? true : v === 'true';
  });

  function toggleRendeFacil(val) {
    setHideRendeFacil(val);
    localStorage.setItem('cal_hideRendeFacil', val);
  }

  function handleTransactionUpdate(txnId, updates) {
    setTransactions(prev => prev.map(t => t.id === txnId ? { ...t, ...updates } : t));
  }

  async function toggleTxnTag(txnId, tagId) {
    const txn     = transactions.find(t => t.id === txnId);
    if (!txn) return;
    const current = (txn.tag_ids || '').split(',').filter(Boolean).map(Number);
    const next    = current.includes(tagId) ? current.filter(x => x !== tagId) : [...current, tagId];
    const r = await fetch(`/api/transactions/${txnId}/tags`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tag_ids: next }),
    });
    const d = await r.json();
    handleTransactionUpdate(txnId, { tag_ids: d.tag_ids });
  }

  async function toggleTxnConjunto(txnId, conjuntoId) {
    const txn     = transactions.find(t => t.id === txnId);
    if (!txn) return;
    const current = (txn.conjunto_ids || '').split(',').filter(Boolean).map(Number);
    const next    = current.includes(conjuntoId) ? current.filter(x => x !== conjuntoId) : [...current, conjuntoId];
    const r = await fetch(`/api/transactions/${txnId}/conjuntos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conjunto_ids: next }),
    });
    const d = await r.json();
    handleTransactionUpdate(txnId, { conjunto_ids: d.conjunto_ids });
    loadConjuntos(); // totais/contagens dos conjuntos podem ter mudado
  }

  async function loadConjuntos() {
    try {
      const r = await fetch('/api/conjuntos');
      const d = await r.json();
      setAllConjuntos(d.results || []);
    } catch {}
  }

  async function loadTags() {
    try {
      const r = await fetch('/api/tags');
      const d = await r.json();
      setAllTags(d.results || []);
    } catch {}
  }

  // Load from local DB (fast)
  async function loadFromDB() {
    setLoading(true);
    setError(null);
    try {
      const [accR, txnR] = await Promise.all([
        fetch('/api/accounts'),
        fetch(`/api/transactions?from=${dateFrom}&to=${dateTo}`),
      ]);
      const [accD, txnD] = await Promise.all([accR.json(), txnR.json()]);
      if (accD.error) throw new Error(accD.error);
      if (txnD.error) throw new Error(txnD.error);
      setAccounts(accD.results || []);
      setTransactions(txnD.results || []);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  async function toggleHidden(accountId) {
    await fetch(`/api/accounts/${accountId}/hidden`, { method: 'POST' });
    const r = await fetch('/api/accounts');
    const d = await r.json();
    setAccounts(d.results || []);
  }


  // Load sync status
  async function loadSyncStatus() {
    try {
      const r = await fetch('/api/sync/status');
      const d = await r.json();
      setSyncStatus(d);
    } catch {}
  }

  // Sync from Pluggy (incremental by default)
async function doSync(full = false) {
    setSyncing(true);
    setError(null);
    setNotice(null);
    try {
      const body = full
        ? { from: (new Date(new Date().getFullYear(), 0, 1).toISOString().slice(0, 10)), to: todayStr() }
        : { to: todayStr() };
      const r = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setNotice(`Sincronizado: ${d.transactions_added} transações adicionadas (${d.date_from} → ${d.date_to})`);
      await Promise.all([loadFromDB(), loadSyncStatus()]);
      setSyncKey(k => k + 1);
    } catch (e) {
      setError(e.message);
    } finally {
      setSyncing(false);
    }
  }

  useEffect(() => { loadTags(); loadConjuntos(); }, []);
  useEffect(() => {
    loadFromDB();
    loadSyncStatus();
  }, [dateFrom, dateTo]);

  const hiddenIds = useMemo(() => new Set(accounts.filter(a => a.hidden).map(a => a.id)), [accounts]);

  const baseTransactions = useMemo(() => {
    const filtered = transactions
      .filter(t => !hiddenIds.has(t.account_id))
      .filter(t => !t.ignored)
      .filter(t => {
        if (!hideRendeFacil) return true;
        const d = (t.description || '').toUpperCase();
        return !(d.includes('REND') && d.includes('FACIL'));
      });
    // Mesma dedupe usada no Calendário/Gráficos Mensais: reconectar uma conta
    // gera um account_id novo, mas o período sobreposto vem duplicado (mesma
    // transação real sob o id antigo E o novo) — sem isso, o card de Saídas
    // do topo (e a aba Transações) contavam essas duplicatas duas vezes.
    const seen    = new Set();
    const deduped = [];
    for (const t of filtered) {
      const k      = localDay(t.date);
      const amt    = Math.abs(parseFloat(t.amount) || 0);
      const dupKey = `${k}|${amt.toFixed(2)}|${t.description}|${t.account_name}|${t.type}`;
      if (seen.has(dupKey)) continue;
      seen.add(dupKey);
      deduped.push(t);
    }
    return deduped;
  }, [transactions, hiddenIds, hideRendeFacil]);

  const filtered = useMemo(() => {
    let t = baseTransactions;
    if (selAcc) t = t.filter(x => x.account_id === selAcc);
    if (selCat) t = t.filter(x => (x.category || '') === selCat);
    if (search)  { const q = search.toLowerCase(); t = t.filter(x => (x.description || '').toLowerCase().includes(q)); }
    if (minAmount !== '') {
      const min = parseFloat(minAmount);
      t = t.filter(x => { const amt = x.type === 'DEBIT' ? -Math.abs(x.amount) : Math.abs(x.amount); return amt >= min; });
    }
    if (maxAmount !== '') {
      const max = parseFloat(maxAmount);
      t = t.filter(x => { const amt = x.type === 'DEBIT' ? -Math.abs(x.amount) : Math.abs(x.amount); return amt <= max; });
    }
    return [...t].sort((a, b) => {
      let va = a[sortField] ?? '', vb = b[sortField] ?? '';
      if (sortField === 'date')   { va = new Date(va); vb = new Date(vb); }
      if (sortField === 'amount') { 
        va = a.type === 'DEBIT' ? -Math.abs(+va) : Math.abs(+va); 
        vb = b.type === 'DEBIT' ? -Math.abs(+vb) : Math.abs(+vb); 
      }
      const cmp = va > vb ? 1 : va < vb ? -1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }, [baseTransactions, selAcc, selCat, search, minAmount, maxAmount, sortField, sortDir]);

  const filteredSum = useMemo(() => {
    return filtered.reduce((acc, t) => {
      const amt = t.type === 'DEBIT' ? -Math.abs(t.amount) : Math.abs(t.amount);
      return acc + amt;
    }, 0);
  }, [filtered]);

  const summary = useMemo(() => {
    const base = selAcc ? baseTransactions.filter(t => t.account_id === selAcc) : baseTransactions;
    let income = 0, expense = 0;
    base.forEach(t => {
      const amt = Math.abs(parseFloat(t.amount) || 0);
      t.type === 'CREDIT' ? (income += amt) : (expense += amt);
    });
    return { income, expense };
  }, [baseTransactions, selAcc]);

  const daysInInterval = useMemo(() => {
    const d1 = new Date(dateFrom + 'T12:00:00');
    const d2 = new Date(dateTo + 'T12:00:00');
    const diffTime = Math.abs(d2 - d1);
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }, [dateFrom, dateTo]);

  // Dias já decorridos no período até hoje (não o período inteiro) — usado na
  // média de gastos/dia das Saídas, para não diluir a média com dias futuros
  // do mês que ainda não aconteceram.
  const daysElapsedInInterval = useMemo(() => {
    const today      = todayStr();
    const effectiveTo = dateTo < today ? dateTo : today;
    const d1 = new Date(dateFrom + 'T12:00:00');
    const d2 = new Date(effectiveTo + 'T12:00:00');
    const diffTime = d2 - d1;
    if (diffTime < 0) return 0; // período inteiramente no futuro
    return Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }, [dateFrom, dateTo]);

  const categories = useMemo(() =>
    [...new Set(baseTransactions.map(t => t.category).filter(Boolean))].sort(),
    [baseTransactions]);

  const catData = useMemo(() => {
    const base = selAcc ? baseTransactions.filter(t => t.account_id === selAcc) : baseTransactions;
    const map = {};
    base.filter(t => t.type !== 'CREDIT').forEach(t => {
      const c = t.category || 'Sem categoria';
      map[c] = (map[c] || 0) + Math.abs(parseFloat(t.amount) || 0);
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [baseTransactions, selAcc]);

  function onSort(f) {
    if (sortField === f) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortField(f); setSortDir('desc'); }
  }

  const bal = summary.income - summary.expense;

  return (
    <div className="app">
      <TopBar
        dateFrom={dateFrom} dateTo={dateTo}
        onFrom={setCustomDateFrom} onTo={setCustomDateTo}
        customInterval={customInterval} onToggleCustomInterval={setCustomInterval}
        syncStatus={syncStatus}
        onSync={() => doSync(false)}
        onFullSync={() => doSync(true)}
        syncing={syncing || loading}
        calYear={calYear} calMonth={calMonth}
        setCalYear={setCalYear} setCalMonth={setCalMonth}
      />

      {error  && <div className="notif error">⚠ {error}</div>}
      {notice && !error && <div className="notif success">✓ {notice}</div>}

      <div>
        <div className="summary-row">
          <SCard label="Entradas"         value={summary.income}  color="green" />
          <SCard label="Saídas"           value={summary.expense} color="red"
            subText={`Média: ${fmt(summary.expense / (daysElapsedInInterval || 1))}/dia`}
            copyText={`Gastos do mês até o momento: ${fmt(summary.expense)}`}
            subCopyText={`Média de gastos por dia: ${fmt(summary.expense / (daysElapsedInInterval || 1))}`} />
          <SCard label="Saldo do Período" value={bal}             color={bal >= 0 ? 'green' : 'red'} subText={`Média: ${fmt(bal / (daysInInterval || 1))}/dia`} />
          <SCard label="Transações"       value={filtered.length} color="blue" isCount />
        </div>
        <div className="tab-bar">
          <button className={`tab-btn${view==='transactions'?' active':''}`} onClick={() => setView('transactions')}>
            Transações
          </button>
          <button className={`tab-btn${view==='calendar'?' active':''}`} onClick={() => setView('calendar')}>
            Calendário
          </button>
          <button className={`tab-btn${view==='investments'?' active':''}`} onClick={() => setView('investments')}>
            Investimentos
          </button>
          <button className={`tab-btn${view==='monthly'?' active':''}`} onClick={() => setView('monthly')}>
            Despesas Mensais
          </button>
          <button className={`tab-btn${view==='yearlycharts'?' active':''}`} onClick={() => setView('yearlycharts')}>
            Gráficos Mensais
          </button>
          <button className={`tab-btn${view==='origin'?' active':''}`} onClick={() => setView('origin')}>
            Origem dos Gastos
          </button>
          <button className={`tab-btn${view==='tags'?' active':''}`} onClick={() => setView('tags')}>
            Tags
          </button>
          <button className={`tab-btn${view==='conjuntos'?' active':''}`} onClick={() => setView('conjuntos')}>
            Conjuntos
          </button>
          <button className={`tab-btn${view==='contingencia'?' active':''}`} onClick={() => setView('contingencia')}>
            Contingência
          </button>
          <button className={`tab-btn${view==='carteira'?' active':''}`} onClick={() => setView('carteira')}>
            Carteira
          </button>
        </div>
      </div>

      {view === 'transactions' ? (
        <div className="app-body">
          <div className="left-panel">
            <AccountList accounts={accounts} selected={selAcc} onSelect={setSelAcc} onToggleHidden={toggleHidden} />
            <CatChart data={catData} />
          </div>
          <div className="right-panel">
            <div className="tbl-controls">
              <select value={selAcc} onChange={e => setSelAcc(e.target.value)}>
                <option value="">Todas as contas</option>
                {accounts.map(a => <option key={a.id} value={a.id}>{a.name} — {a.institution}</option>)}
              </select>
              <select value={selCat} onChange={e => setSelCat(e.target.value)}>
                <option value="">Todas as categorias</option>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <input type="text" placeholder="Buscar descrição…" value={search}
                onChange={e => setSearch(e.target.value)} />
              <input type="number" placeholder="Mín (R$)" value={minAmount}
                onChange={e => setMinAmount(e.target.value)} style={{width: 80}} />
              <input type="number" placeholder="Máx (R$)" value={maxAmount}
                onChange={e => setMaxAmount(e.target.value)} style={{width: 80}} />
              <span className="txn-count">
                {filtered.length} transações
                <span style={{marginLeft: 12, fontWeight: 600}}>Total: {fmt(filteredSum)}</span>
              </span>
            </div>
            <div className="tbl-wrap">
              <TxnTable txns={filtered} sortField={sortField} sortDir={sortDir}
                onSort={onSort} onSyncClick={() => doSync(false)} tags={allTags} onToggleTxnTag={toggleTxnTag}
                conjuntos={allConjuntos} onToggleTxnConjunto={toggleTxnConjunto} />
            </div>
          </div>
        </div>
      ) : view === 'investments' ? (
        <InvestmentsView />
      ) : view === 'monthly' ? (
        <MonthlyExpensesView tags={allTags} dateFrom={dateFrom} dateTo={dateTo} conjuntos={allConjuntos} />
      ) : view === 'yearlycharts' ? (
        <MonthlyChartsView allAccounts={accounts.filter(a => !a.hidden)} hideRendeFacil={hideRendeFacil} calYear={calYear} setCalYear={setCalYear} />
      ) : view === 'origin' ? (
        <OriginView allAccounts={accounts.filter(a => !a.hidden)} hideRendeFacil={hideRendeFacil} calYear={calYear} calMonth={calMonth} setCalYear={setCalYear} setCalMonth={setCalMonth} />
      ) : view === 'tags' ? (
        <TagsView tags={allTags} onTagsChange={loadTags} />
      ) : view === 'conjuntos' ? (
        <ConjuntosView conjuntos={allConjuntos} onConjuntosChange={loadConjuntos} />
      ) : view === 'contingencia' ? (
        <ContingenciaView accounts={accounts} onChanged={() => { loadFromDB(); setSyncKey(k => k + 1); }} />
      ) : view === 'carteira' ? (
        <AtivosView />
      ) : (
        <CalendarView allAccounts={accounts.filter(a => !a.hidden)} syncKey={syncKey} tags={allTags} onTagsChange={loadTags} conjuntos={allConjuntos} onConjuntosChange={loadConjuntos} onContingenciaChange={() => loadFromDB()} hideRendeFacil={hideRendeFacil} toggleRendeFacil={toggleRendeFacil} onTransactionUpdate={handleTransactionUpdate} calYear={calYear} calMonth={calMonth} setCalYear={setCalYear} setCalMonth={setCalMonth} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
