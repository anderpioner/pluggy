                              style={{cursor:'pointer'}}
                              onClick={e => { e.stopPropagation(); desvalidarContingencia && desvalidarContingencia(t.id); }}>
                              ⚡ desvalidar
                            </span>
                          )}
                          <span className="cal-txn-desc" title={t.description}>{t.description || '—'}</span>
                          {isDup && <span className="dup-badge" title="Possível duplicata: mesmo valor na mesma conta em data próxima">⚠</span>}
                        </div>
                        {(() => {
                          const txnTagIds = parseTxnTagIds(t);
                          const txnTags   = tags.filter(tg => txnTagIds.includes(tg.id));
                          const isOpen    = tagPopover?.txnId === t.id;
                          return (
                            <div className="cal-txn-tags">
                              {txnTags.map(tg => (
                                <span key={tg.id} className="tag-pill"
                                  style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66'}}
                                  title={`Remover: ${tg.name}`}
                                  onClick={e => { e.stopPropagation(); toggleTxnTag(t.id, tg.id); }}>
                                  {tg.name}
                                </span>
                              ))}
                              <button className="tag-add-btn"
                                title="Adicionar tag"
                                onClick={e => {
                                  e.stopPropagation();
                                  if (isOpen) { setTagPopover(null); return; }
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  setTagPopover({ txnId: t.id, top: rect.bottom + 4, left: rect.left });
                                }}>
                                {isOpen ? '✕' : '+'}
                              </button>
                            </div>
                          );
                        })()}
                        {(() => {
                          const txnConjuntoIds = parseTxnConjuntoIds(t);
                          const txnConjuntos   = conjuntos.filter(cj => txnConjuntoIds.includes(cj.id));
                          const isOpen         = conjuntoPopover?.txnId === t.id;
                          return (
                            <div className="cal-txn-tags">
                              {txnConjuntos.map(cj => (
                                <span key={cj.id} className="tag-pill"
                                  style={{background: cj.color+'22', color: cj.color, borderColor: cj.color+'66'}}
                                  title={`Remover de: ${cj.name}`}
                                  onClick={e => { e.stopPropagation(); toggleTxnConjunto(t.id, cj.id); }}>
                                  {cj.name}
                                </span>
                              ))}
                              <button className="tag-add-btn"
                                title="Adicionar a um conjunto"
                                onClick={e => {
                                  e.stopPropagation();
                                  if (isOpen) { setConjuntoPopover(null); return; }
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  setConjuntoPopover({ txnId: t.id, top: rect.bottom + 4, left: rect.left });
                                }}>
                                {isOpen ? '✕' : '+'}
                              </button>
                            </div>
                          );
                        })()}
                        <span className="cal-txn-cat">{t.category || '—'}</span>
                        <span className="cal-txn-owner" style={{color: ownerColor(t.owner_name)}}>{firstName(t.owner_name) || '—'}</span>
                        <span className="cal-txn-acc">{t.account_name || '—'}</span>
                        <span className={`cal-txn-amt ${t.type}`}>
                          {t.type==='DEBIT'?'−':'+'}{fmt(Math.abs(t.amount))}
                        </span>
                      </div>
                    ); })
                  }
                </div>
            }
          </div>
        )}
      </div>
      {tagPopover && (() => {
        const txn       = txns.find(t => t.id === tagPopover.txnId);
        const txnTagIds = txn ? parseTxnTagIds(txn) : [];
        return (
          <div className="tag-selector"
            style={{top: tagPopover.top, left: tagPopover.left}}
            onClick={e => e.stopPropagation()}>
            <div className="tag-selector-title">Tags</div>
            {tags.map(tg => (
              <label key={tg.id} className="tag-selector-item">
                <input type="checkbox"
                  checked={txnTagIds.includes(tg.id)}
                  onChange={() => toggleTxnTag(tagPopover.txnId, tg.id)} />
                <span className="tag-pill"
                  style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66'}}>
                  {tg.name}
                </span>
              </label>
            ))}
          </div>
        );
      })()}
      {conjuntoPopover && (() => {
        const txn            = txns.find(t => t.id === conjuntoPopover.txnId);
        const txnConjuntoIds = txn ? parseTxnConjuntoIds(txn) : [];
        return (
          <div className="tag-selector"
            style={{top: conjuntoPopover.top, left: conjuntoPopover.left}}
            onClick={e => e.stopPropagation()}>
            <div className="tag-selector-title">Conjuntos</div>
            {monthConjuntos.length === 0 && (
              <div style={{fontSize:11, color:'var(--muted)', maxWidth:200, padding:'2px 6px'}}>
                Nenhum conjunto com transações neste mês ainda. Associe pela aba "Transações" ou "Conjuntos".
              </div>
            )}
            {monthConjuntos.map(cj => (
              <label key={cj.id} className="tag-selector-item">
                <input type="checkbox"
                  checked={txnConjuntoIds.includes(cj.id)}
                  onChange={() => toggleTxnConjunto(conjuntoPopover.txnId, cj.id)} />
                <span className="tag-pill"
                  style={{background: cj.color+'22', color: cj.color, borderColor: cj.color+'66'}}>
                  {cj.name}
                </span>
              </label>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

/* ── Investment dedup ── */
function dedupInvestments(list) {
  const invKey = inv => [
    inv.type || '',
    inv.code || inv.isin || inv.name || '',
    Math.round((inv.amount   || 0) * 100),
    Math.round((inv.balance  || 0) * 100),
    Math.round((inv.quantity || 0) * 1000),
  ].join('|');

  // Para cada dono, calcula o máximo de cópias de cada chave em qualquer item_id único
  const perOwnerItem = {};
  list.forEach(inv => {
    const owner = inv.owner || '';
    const ok = `${owner}||${inv.item_id}`;
    const k  = invKey(inv);
    if (!perOwnerItem[ok]) perOwnerItem[ok] = {};
    perOwnerItem[ok][k] = (perOwnerItem[ok][k] || 0) + 1;
  });

  const ownerMax = {};
  Object.entries(perOwnerItem).forEach(([ok, counts]) => {
    const owner = ok.split('||')[0];
    if (!ownerMax[owner]) ownerMax[owner] = {};
    Object.entries(counts).forEach(([k, c]) => {
      ownerMax[owner][k] = Math.max(ownerMax[owner][k] || 0, c);
    });
  });

  // Filtra mantendo no máximo ownerMax[owner][key] cópias por dono
  const seen = {};
  return list.filter(inv => {
    const owner = inv.owner || '';
    const k     = invKey(inv);
    const sk    = `${owner}||${k}`;
    seen[sk] = (seen[sk] || 0) + 1;
    return seen[sk] <= (ownerMax[owner]?.[k] || 1);
  });
}

/* ── Assets bar chart ── */
function AssetsBarChart({ groups }) {
  const ref   = useRef(null);
  const chart = useRef(null);

  useEffect(() => {
    if (!ref.current || !groups.length) return;
    if (chart.current) chart.current.destroy();

    const TYPE_COLORS = {
      EQUITY:           'rgba(74,144,217,0.75)',
      REAL_ESTATE_FUND: 'rgba(171,71,188,0.75)',
      ETF:              'rgba(38,198,218,0.75)',
      MUTUAL_FUND:      'rgba(255,167,38,0.75)',
      MULTIMARKET:      'rgba(255,112,67,0.75)',
      FIXED_INCOME:     'rgba(0,212,170,0.75)',
      COE:              'rgba(236,64,122,0.75)',
      RETIREMENT_PLAN:  'rgba(141,110,99,0.75)',
      OTHER:            'rgba(120,144,156,0.75)',
    };

    const sorted = [...groups].sort((a, b) => b.amount - a.amount);
    const labels = sorted.map(g => g.name ? g.name.slice(0, 30) : g.code);
    const data   = sorted.map(g => g.amount);
    const colors = sorted.map(g => TYPE_COLORS[g.type] || TYPE_COLORS.OTHER);

    chart.current = new Chart(ref.current, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Valor Investido',
          data,
          backgroundColor: colors,
          borderRadius: 3,
        }],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => sorted[items[0].dataIndex].name,
              label: (ctx) => ` ${fmt(ctx.raw)}`,
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: '#8899aa', font: { size: 10 },
              callback: v => v >= 1000 ? `${(v/1000).toFixed(0)}k` : v,
            },
            grid: { color: 'rgba(255,255,255,0.05)' },
          },
          y: {
            ticks: { color: '#c8d8e8', font: { size: 10 } },
            grid: { display: false },
          },
        },
      },
    });
    return () => chart.current?.destroy();
  }, [groups]);

  if (!groups.length) return null;
  const height = Math.max(300, groups.length * 26);
  return (
    <div style={{padding:'16px',background:'var(--bg2)',borderTop:'1px solid var(--border)'}}>
      <div className="panel-title" style={{marginBottom:8}}>Valor Investido por Ativo</div>
      <div style={{position:'relative', height}}><canvas ref={ref} /></div>
    </div>
  );
}

/* ── Assets table (Por Ativo) ── */
function AssetsTable({ groups, totals }) {
  const [sortField, setSortField] = useState('balance');
  const [sortDir,   setSortDir]   = useState('desc');

  function onSort(f) {
    if (sortField === f) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortField(f); setSortDir('desc'); }
  }
  const arrow  = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const fmtPct = v => v != null ? `${(v * 100).toFixed(2)}%` : '—';
  const fmtQty = v => v != null ? v.toLocaleString('pt-BR', { maximumFractionDigits: 6 }) : '—';

  const TYPE_LABELS = {
    EQUITY:'Ações', FIXED_INCOME:'Renda Fixa', MUTUAL_FUND:'Fundos',
    ETF:'ETF', COE:'COE', REAL_ESTATE_FUND:'FIIs',
    MULTIMARKET:'Multimercado', RETIREMENT_PLAN:'Previdência', OTHER:'Outros',
  };

  const sorted = useMemo(() => {
    return [...groups].sort((a, b) => {
      let va = a[sortField] ?? '', vb = b[sortField] ?? '';
      const cmp = va > vb ? 1 : va < vb ? -1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }, [groups, sortField, sortDir]);

  // group sorted list by type for separator rows
  const byType = useMemo(() => {
    const map = {};
    sorted.forEach(g => { const t = g.type||'OTHER'; (map[t]=map[t]||[]).push(g); });
    const typeOrder = ['EQUITY','REAL_ESTATE_FUND','ETF','MUTUAL_FUND','MULTIMARKET','FIXED_INCOME','COE','RETIREMENT_PLAN','OTHER'];
    return typeOrder.filter(t => map[t]).map(t => ({ type: t, label: TYPE_LABELS[t]||t, items: map[t] }));
  }, [sorted]);

  const gain = totals.balance - totals.amount;

  return (
    <div>
      <div className="summary-row">
        <SCard label="Valor Atual"     value={totals.balance} color="blue" />
        <SCard label="Valor Investido" value={totals.amount}  color="green" />
        <SCard label="Ganho / Perda"   value={gain}           color={gain >= 0 ? 'green' : 'red'} />
        <SCard label="Ativos únicos"   value={sorted.length}  color="blue" isCount />
      </div>
      <div className="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style={{width:4,padding:0}} />
              <th className={sortField==='type'?'sorted':''} onClick={() => onSort('type')}>Tipo{arrow('type')}</th>
              <th className={sortField==='name'?'sorted':''} onClick={() => onSort('name')}>Nome{arrow('name')}</th>
              <th className={sortField==='code'?'sorted':''} onClick={() => onSort('code')}>Código / ISIN{arrow('code')}</th>
              <th className={sortField==='quantity'?'sorted':''} onClick={() => onSort('quantity')} style={{textAlign:'right'}}>Quantidade{arrow('quantity')}</th>
              <th className={sortField==='value'?'sorted':''} onClick={() => onSort('value')} style={{textAlign:'right'}}>Vl. Unit.{arrow('value')}</th>
              <th className={sortField==='amount'?'sorted':''} onClick={() => onSort('amount')} style={{textAlign:'right'}}>Investido{arrow('amount')}</th>
              <th className={sortField==='balance'?'sorted':''} onClick={() => onSort('balance')} style={{textAlign:'right'}}>Valor Atual{arrow('balance')}</th>
              <th style={{textAlign:'right'}}>Ganho/Perda</th>
              <th className={sortField==='last_month_rate'?'sorted':''} onClick={() => onSort('last_month_rate')} style={{textAlign:'right'}}>1M%{arrow('last_month_rate')}</th>
              <th className={sortField==='last_twelve_months_rate'?'sorted':''} onClick={() => onSort('last_twelve_months_rate')} style={{textAlign:'right'}}>12M%{arrow('last_twelve_months_rate')}</th>
              <th className={sortField==='annual_rate'?'sorted':''} onClick={() => onSort('annual_rate')} style={{textAlign:'right'}}>Anual%{arrow('annual_rate')}</th>
              <th>Vencimento</th>
              <th>Donos</th>
            </tr>
          </thead>
          <tbody>
            {byType.map(({ type, label, items }) => {
              const tBal  = items.reduce((s, i) => s + i.balance, 0);
              const tAmt  = items.reduce((s, i) => s + i.amount,  0);
              const tGain = tBal - tAmt;
              const pct   = tAmt > 0 ? tGain / tAmt * 100 : null;
              return (
                <React.Fragment key={type}>
                  <tr className="inv-group-hdr">
                    <td colSpan={14} style={{borderLeftColor:'var(--accent)'}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <span className="inv-group-name">{label}</span>
                        <span style={{color:'var(--muted)',fontSize:10}}>{items.length} ativo{items.length!==1?'s':''}</span>
                      </div>
                      <div className="inv-group-sub">
                        <span>Investido: <span style={{color:'var(--muted)'}}>{fmt(tAmt)}</span></span>
                        <span>Atual: <span style={{color:'var(--blue)'}}>{fmt(tBal)}</span></span>
                        <span>Ganho: <span style={{color: tGain>=0?'var(--green)':'var(--red)'}}>
                          {tGain>=0?'+':''}{fmt(tGain)}
                          {pct!=null && <span style={{fontSize:10,marginLeft:4}}>({pct>=0?'+':''}{pct.toFixed(1)}%)</span>}
                        </span></span>
                      </div>
                    </td>
                  </tr>
                  {items.map(inv => {
                    const g      = inv.balance - inv.amount;
                    const gPct   = inv.amount ? g / inv.amount * 100 : null;
                    const gColor = g >= 0 ? 'var(--green)' : 'var(--red)';
                    return (
                      <tr key={inv.key}>
                        <td style={{borderLeft:'3px solid var(--accent)',padding:'5px 0',width:4}} />
                        <td className="cat">{inv.subtype || inv.type || '—'}</td>
                        <td className="desc" title={inv.name} style={{maxWidth:240}}>{inv.name}</td>
                        <td className="cat" title={inv.isin}>{inv.code}</td>
                        <td className="dt"  style={{textAlign:'right'}}>{fmtQty(inv.quantity)}</td>
                        <td className="amt" style={{color:'var(--text)'}}>{inv.value != null ? fmt(inv.value) : '—'}</td>
                        <td className="amt" style={{color:'var(--muted)'}}>{fmt(inv.amount)}</td>
                        <td className="amt" style={{color:'var(--blue)'}}>{fmt(inv.balance)}</td>
                        <td className="amt" style={{color: gColor}}>
                          {g>=0?'+':''}{fmt(g)}
                          {gPct!=null && <span style={{fontSize:10,marginLeft:4}}>({gPct>=0?'+':''}{gPct.toFixed(1)}%)</span>}
                        </td>
                        <td className="amt" style={{color:(inv.last_month_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.last_month_rate)}</td>
                        <td className="amt" style={{color:(inv.last_twelve_months_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.last_twelve_months_rate)}</td>
                        <td className="amt" style={{color:(inv.annual_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.annual_rate)}</td>
                        <td className="dt">{fmtDate(inv.due_date)}</td>
                        <td className="cat">{inv.owners || '—'}</td>
                      </tr>
                    );
                  })}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <AssetsBarChart groups={sorted} />
    </div>
  );
}

/* ── Investments view ── */
function InvestmentsView() {
  const [investments, setInvestments] = useState([]);
  const [loading,     setLoading]     = useState(false);
  const [error,       setError]       = useState(null);
  const [sortField,   setSortField]   = useState('balance');
  const [sortDir,     setSortDir]     = useState('desc');
  const [filterType,  setFilterType]  = useState('');
  const [filterInst,  setFilterInst]  = useState('');
  const [dedupOn,     setDedupOn]     = useState(() => {
    const v = localStorage.getItem('inv_dedup');
    return v === null ? true : v === 'true';
  });
  const [invView,     setInvView]     = useState('accounts'); // 'accounts' | 'assets'

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/api/investments');
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setInvestments(d.results || []);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }

  async function sync() {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/api/investments/sync', { method: 'POST' });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      await load();
    } catch (e) { setError(e.message); setLoading(false); }
  }

  const types        = useMemo(() => [...new Set(investments.map(i => i.type).filter(Boolean))].sort(), [investments]);
  const institutions = useMemo(() => [...new Set(investments.map(i => i.institution).filter(Boolean))].sort(), [investments]);

  const sortFn = (a, b) => {
    let va = a[sortField] ?? '', vb = b[sortField] ?? '';
    const cmp = va > vb ? 1 : va < vb ? -1 : 0;
    return sortDir === 'asc' ? cmp : -cmp;
  };

  const TYPE_LABELS = {
    EQUITY:            'Ações',
    FIXED_INCOME:      'Renda Fixa',
    MUTUAL_FUND:       'Fundos de Investimento',
    ETF:               'ETF',
    COE:               'COE',
    REAL_ESTATE_FUND:  'Fundos Imobiliários',
    MULTIMARKET:       'Multimercado',
    RETIREMENT_PLAN:   'Previdência',
    OTHER:             'Outros',
  };

  const grouped = useMemo(() => {
    let list = investments;
    if (filterType) list = list.filter(i => i.type === filterType);
    if (filterInst) list = list.filter(i => i.institution === filterInst);

    if (dedupOn) list = dedupInvestments(list);

    const typeOrder = ['EQUITY','REAL_ESTATE_FUND','ETF','MUTUAL_FUND','MULTIMARKET','FIXED_INCOME','COE','RETIREMENT_PLAN','OTHER'];

    const byItem = {};
    list.forEach(inv => {
      const itemKey = inv.item_id || inv.institution || 'outros';
      if (!byItem[itemKey]) byItem[itemKey] = { institution: inv.institution, owner: inv.owner, items: [] };
      byItem[itemKey].items.push(inv);
    });

    return Object.values(byItem)
      .sort((a, b) => (a.owner||'').localeCompare(b.owner||'', 'pt-BR') || (a.institution||'').localeCompare(b.institution||'', 'pt-BR'))
      .map(g => ({
        ...g,
        items: [...g.items].sort((a, b) =>
          typeOrder.indexOf(a.type||'OTHER') - typeOrder.indexOf(b.type||'OTHER') || sortFn(a, b)
        ),
      }));
  }, [investments, filterType, filterInst, sortField, sortDir, dedupOn]);

  const filtered = useMemo(() => grouped.flatMap(g => g.items), [grouped]);

  const totals = useMemo(() =>
    filtered.reduce((acc, i) => ({
      balance: acc.balance + (i.balance || 0),
      amount:  acc.amount  + (i.amount  || 0),
    }), { balance: 0, amount: 0 }),
  [filtered]);

  function onSort(f) {
    if (sortField === f) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortField(f); setSortDir('desc'); }
  }
  const arrow  = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const fmtPct = v => v != null ? `${(v * 100).toFixed(2)}%` : '—';
  const fmtQty = v => v != null ? v.toLocaleString('pt-BR', { maximumFractionDigits: 6 }) : '—';

  const assetGroups = useMemo(() => {
    let list = investments;
    if (filterType) list = list.filter(i => i.type === filterType);
    if (filterInst) list = list.filter(i => i.institution === filterInst);

    if (dedupOn) list = dedupInvestments(list);

    const map = {};
    list.forEach(inv => {
      const key = inv.code || inv.isin || inv.name || inv.id;
      if (!map[key]) {
        map[key] = {
          key,
          code:                    inv.code || inv.isin || '—',
          isin:                    inv.isin || '',
          name:                    inv.name || '—',
          type:                    inv.type || '—',
          subtype:                 inv.subtype || '—',
          currency_code:           inv.currency_code || 'BRL',
          last_month_rate:         inv.last_month_rate,
          last_twelve_months_rate: inv.last_twelve_months_rate,
          annual_rate:             inv.annual_rate,
          status:                  inv.status || '—',
          due_date:                inv.due_date || null,
          quantity: 0, amount: 0, balance: 0,
          owners: new Set(),
        };
      }
      const g = map[key];
      g.quantity += inv.quantity || 0;
      g.amount   += inv.amount   || 0;
      g.balance  += inv.balance  || 0;
      if (inv.owner) g.owners.add(firstName(inv.owner));
    });

    const typeOrder = ['EQUITY','REAL_ESTATE_FUND','ETF','MUTUAL_FUND','MULTIMARKET','FIXED_INCOME','COE','RETIREMENT_PLAN','OTHER'];
    return Object.values(map)
      .map(g => ({ ...g, owners: [...g.owners].join(', '), value: g.quantity ? g.balance / g.quantity : null }))
      .sort((a, b) =>
        typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type) ||
        (b.balance - a.balance)
      );
  }, [investments, filterType, filterInst, dedupOn]);

  const assetTotals = useMemo(() =>
    assetGroups.reduce((acc, g) => ({ balance: acc.balance + g.balance, amount: acc.amount + g.amount }), { balance: 0, amount: 0 }),
  [assetGroups]);

  const gain = totals.balance - totals.amount;

  return (
    <div>
      <div className="summary-row">
        <SCard label="Valor Atual"     value={totals.balance} color="blue" />
        <SCard label="Valor Investido" value={totals.amount}  color="green" />
        <SCard label="Ganho / Perda"   value={gain}           color={gain >= 0 ? 'green' : 'red'} />
        <SCard label="Ativos"          value={filtered.length} color="blue" isCount />
      </div>

      <div className="tbl-controls">
        <div className="inv-view-toggle">
          <button className={`inv-view-btn${invView==='accounts'?' active':''}`} onClick={() => setInvView('accounts')}>Por Conta</button>
          <button className={`inv-view-btn${invView==='assets'?' active':''}`}   onClick={() => setInvView('assets')}>Por Ativo</button>
        </div>
        <select value={filterType} onChange={e => setFilterType(e.target.value)}>
          <option value="">Todos os tipos</option>
          {types.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <select value={filterInst} onChange={e => setFilterInst(e.target.value)}>
          <option value="">Todas as instituições</option>
          {institutions.map(i => <option key={i} value={i}>{i}</option>)}
        </select>
        {invView === 'accounts' && (
          <label className="cal-check-label">
            <input type="checkbox" checked={dedupOn} onChange={e => { setDedupOn(e.target.checked); localStorage.setItem('inv_dedup', e.target.checked); }} />
            Ocultar duplicatas
          </label>
        )}
        <button className="sync-btn" onClick={sync} disabled={loading} style={{marginLeft:'auto'}}>
          {loading ? <><span className="spin"/>Sincronizando…</> : 'Sincronizar'}
        </button>
      </div>

      {error && <div className="notif error">⚠ {error}</div>}

      {loading ? (
        <div className="empty"><span className="spin" style={{width:16,height:16,marginRight:8}} />Buscando investimentos…</div>
      ) : filtered.length === 0 && !error ? (
        <div className="empty">Nenhum investimento encontrado.</div>
      ) : invView === 'assets' ? (
        <AssetsTable groups={assetGroups} totals={assetTotals} />
      ) : (
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style={{width:4,padding:0}} />
                <th className={sortField==='institution'?'sorted':''} onClick={() => onSort('institution')}>Instituição{arrow('institution')}</th>
                <th className={sortField==='type'?'sorted':''} onClick={() => onSort('type')}>Tipo{arrow('type')}</th>
                <th>Subtipo</th>
                <th className={sortField==='name'?'sorted':''} onClick={() => onSort('name')}>Nome{arrow('name')}</th>
                <th>Código / ISIN</th>
                <th className={sortField==='quantity'?'sorted':''} onClick={() => onSort('quantity')} style={{textAlign:'right'}}>Quantidade{arrow('quantity')}</th>
                <th className={sortField==='value'?'sorted':''} onClick={() => onSort('value')} style={{textAlign:'right'}}>Vl. Unit.{arrow('value')}</th>
                <th className={sortField==='amount'?'sorted':''} onClick={() => onSort('amount')} style={{textAlign:'right'}}>Investido{arrow('amount')}</th>
                <th className={sortField==='balance'?'sorted':''} onClick={() => onSort('balance')} style={{textAlign:'right'}}>Valor Atual{arrow('balance')}</th>
                <th style={{textAlign:'right'}}>Ganho/Perda</th>
                <th className={sortField==='last_month_rate'?'sorted':''} onClick={() => onSort('last_month_rate')} style={{textAlign:'right'}}>1M%{arrow('last_month_rate')}</th>
                <th className={sortField==='last_twelve_months_rate'?'sorted':''} onClick={() => onSort('last_twelve_months_rate')} style={{textAlign:'right'}}>12M%{arrow('last_twelve_months_rate')}</th>
                <th className={sortField==='annual_rate'?'sorted':''} onClick={() => onSort('annual_rate')} style={{textAlign:'right'}}>Anual%{arrow('annual_rate')}</th>
                <th className={sortField==='taxes'?'sorted':''} onClick={() => onSort('taxes')} style={{textAlign:'right'}}>IR/Taxes{arrow('taxes')}</th>
                <th>Data</th>
                <th>Vencimento</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {grouped.map(group => {
                const gBal   = group.items.reduce((s, i) => s + (i.balance || 0), 0);
                const gAmt   = group.items.reduce((s, i) => s + (i.amount  || 0), 0);
                const gGain  = gBal - gAmt;
                const color  = ownerColor(group.owner);
                return (
                  <React.Fragment key={group.institution}>
                    <tr className="inv-group-hdr">
                      <td colSpan={18} style={{borderLeftColor: color}}>
                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                          {group.owner && (
                            <span style={{color, fontWeight:700}}>{firstName(group.owner)}</span>
                          )}
                          <span className="inv-group-name">{group.institution}</span>
                          <span style={{color:'var(--muted)',fontSize:10}}>{group.items.length} ativo{group.items.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div className="inv-group-sub">
                          <span>Investido: <span style={{color:'var(--muted)'}}>{fmt(gAmt)}</span></span>
                          <span>Atual: <span style={{color:'var(--blue)'}}>{fmt(gBal)}</span></span>
                          <span>Ganho: <span style={{color: gGain >= 0 ? 'var(--green)' : 'var(--red)'}}>
                            {gGain >= 0 ? '+' : ''}{fmt(gGain)}
                            {gAmt > 0 && <span style={{fontSize:10,marginLeft:4}}>({(gGain/gAmt*100).toFixed(1)}%)</span>}
                          </span></span>
                        </div>
                      </td>
                    </tr>
                    {group.items.map(inv => {
                      const g      = (inv.balance || 0) - (inv.amount || 0);
                      const gPct   = inv.amount ? g / inv.amount * 100 : null;
                      const gColor = g >= 0 ? 'var(--green)' : 'var(--red)';
                      return (
                        <tr key={inv.id}>
                          <td style={{borderLeft:`3px solid ${color}`,padding:'5px 10px',width:4}} />
                          <td className="acc">{inv.institution || '—'}</td>
                          <td className="cat">{inv.type || '—'}</td>
                          <td className="cat">{inv.subtype || '—'}</td>
                          <td className="desc" title={inv.name} style={{maxWidth:220}}>{inv.name || '—'}</td>
                          <td className="cat" title={inv.isin}>{inv.code || inv.isin || '—'}</td>
                          <td className="dt"  style={{textAlign:'right'}}>{fmtQty(inv.quantity)}</td>
                          <td className="amt" style={{color:'var(--text)'}}>{inv.value  != null ? fmt(inv.value)  : '—'}</td>
                          <td className="amt" style={{color:'var(--muted)'}}>{inv.amount != null ? fmt(inv.amount) : '—'}</td>
                          <td className="amt" style={{color:'var(--blue)'}}>{inv.balance != null ? fmt(inv.balance) : '—'}</td>
                          <td className="amt" style={{color: gColor}}>
                            {inv.amount != null && inv.balance != null
                              ? <>{g >= 0 ? '+' : ''}{fmt(g)}{gPct != null ? <span style={{fontSize:10,marginLeft:4}}>({gPct >= 0?'+':''}{gPct.toFixed(1)}%)</span> : null}</>
                              : '—'}
                          </td>
                          <td className="amt" style={{color:(inv.last_month_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.last_month_rate)}</td>
                          <td className="amt" style={{color:(inv.last_twelve_months_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.last_twelve_months_rate)}</td>
                          <td className="amt" style={{color:(inv.annual_rate||0)>=0?'var(--green)':'var(--red)'}}>{fmtPct(inv.annual_rate)}</td>
                          <td className="amt" style={{color:'var(--muted)'}}>{inv.taxes != null ? fmt(inv.taxes) : '—'}</td>
                          <td className="dt">{fmtDate(inv.date)}</td>
                          <td className="dt">{fmtDate(inv.due_date)}</td>
                          <td className="cat">{inv.status || '—'}</td>
                        </tr>
                      );
                    })}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ── Tags View ── */
function TagsView({ tags, onTagsChange }) {
  const [newName,  setNewName]  = useState('');
  const [newColor, setNewColor] = useState('#64b5f6');
  const [editId,   setEditId]   = useState(null);
  const [editName, setEditName] = useState('');
  const [editColor,setEditColor]= useState('');

  async function addTag() {
    const name = newName.trim();
    if (!name) return;
    await fetch('/api/tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, color: newColor }),
    });
    setNewName('');
    onTagsChange();
  }

  async function saveEdit(id) {
    const name = editName.trim();
    if (!name) return;
    await fetch(`/api/tags/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, color: editColor }),
    });
    setEditId(null);
    onTagsChange();
  }

  async function deleteTag(id) {
    if (!confirm('Excluir esta tag? Será removida de todas as transações.')) return;
    await fetch(`/api/tags/${id}`, { method: 'DELETE' });
    onTagsChange();
  }

  function startEdit(tag) {
    setEditId(tag.id);
    setEditName(tag.name);
    setEditColor(tag.color);
  }

  return (
    <div className="tags-view">
      <h2>Gerenciar Tags</h2>
      <div className="tags-grid">
        {tags.map(tag => (
          <div key={tag.id} className="tag-mgmt-row">
            <span className="tag-pill" style={{background: tag.color + '22', color: tag.color, borderColor: tag.color + '66'}}>
              {tag.name}
            </span>
            {editId === tag.id ? (
              <div className="tag-inline-edit">
                <input type="color" value={editColor} onChange={e => setEditColor(e.target.value)} />
                <input type="text" value={editName} onChange={e => setEditName(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') saveEdit(tag.id); if (e.key === 'Escape') setEditId(null); }} autoFocus />
                <button className="tag-mgmt-btn" onClick={() => saveEdit(tag.id)} title="Salvar">✓</button>
                <button className="tag-mgmt-btn" onClick={() => setEditId(null)} title="Cancelar">✕</button>
              </div>
            ) : (
              <>
                <span className="tag-mgmt-name">{tag.name}</span>
                <button className="tag-mgmt-btn" onClick={() => startEdit(tag)} title="Editar">✎</button>
                <button className="tag-mgmt-btn del" onClick={() => deleteTag(tag.id)} title="Excluir">✕</button>
              </>
            )}
          </div>
        ))}
      </div>
      <div className="tag-form">
        <input type="color" value={newColor} onChange={e => setNewColor(e.target.value)} title="Cor" />
        <input type="text" placeholder="Nome da nova tag…" value={newName}
          onChange={e => setNewName(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && addTag()} />
        <button onClick={addTag}>+ Adicionar</button>
      </div>
    </div>
  );
}

/* ── Conjunto detail: transações do conjunto + busca para adicionar mais ── */
function ConjuntoDetail({ conjunto, onChange }) {
  const [txns,          setTxns]          = useState([]);
  const [loading,       setLoading]       = useState(false);
  const [search,        setSearch]        = useState('');
  const [searchResults, setSearchResults] = useState(null); // null = ainda não buscou
  const [searching,     setSearching]     = useState(false);

  async function loadTxns() {
    setLoading(true);
    try {
      const r = await fetch(`/api/conjuntos/${conjunto.id}/transactions`);
      const d = await r.json();
      setTxns(d.results || []);
    } catch {} finally { setLoading(false); }
  }

  useEffect(() => { loadTxns(); }, [conjunto.id]);

  async function removeTxn(t) {
    const current = (t.conjunto_ids || '').split(',').filter(Boolean).map(Number);
    const next    = current.filter(x => x !== conjunto.id);
    await fetch(`/api/transactions/${t.id}/conjuntos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conjunto_ids: next }),
    });
    loadTxns();
    onChange();
  }

  async function doSearch() {
    const q = search.trim();
    if (!q) { setSearchResults(null); return; }
    setSearching(true);
    try {
      const r = await fetch(`/api/transactions?q=${encodeURIComponent(q)}`);
      const d = await r.json();
      setSearchResults(d.results || []);
    } catch {} finally { setSearching(false); }
  }

  async function addTxn(t) {
    const current = (t.conjunto_ids || '').split(',').filter(Boolean).map(Number);
    if (current.includes(conjunto.id)) return;
    const next = [...current, conjunto.id];
    await fetch(`/api/transactions/${t.id}/conjuntos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conjunto_ids: next }),
    });
    setSearchResults(prev => prev && prev.map(x => x.id === t.id ? { ...x, conjunto_ids: next.join(',') } : x));
    loadTxns();
    onChange();
  }

  const shownResults = searchResults ? searchResults.slice(0, 30) : [];

  return (
    <div className="conjunto-detail">
      {conjunto.description && <div className="conjunto-detail-desc">{conjunto.description}</div>}

      {loading ? (
        <div className="cal-no-txn">Carregando…</div>
      ) : !txns.length ? (
        <div className="cal-no-txn">Nenhuma transação neste conjunto ainda. Busque abaixo para adicionar.</div>
      ) : (
        <div className="conjunto-txn-list">
          <div className="conjunto-txn-row hdr">
            <span className="conjunto-txn-date">Data</span>
            <span className="conjunto-txn-desc">Descrição</span>
            <span className="conjunto-txn-acc">Conta</span>
            <span className="conjunto-txn-amt">Valor</span>
            <span className="conjunto-txn-action" />
          </div>
          {txns.map(t => (
            <div key={t.id} className="conjunto-txn-row">
              <span className="conjunto-txn-date">{fmtDate(t.date)}</span>
              <span className="conjunto-txn-desc" title={t.description}>{t.description || '—'}</span>
              <span className="conjunto-txn-acc" title={t.account_name}>{t.account_name || '—'}</span>
              <span className={`conjunto-txn-amt ${t.type === 'CREDIT' ? 'CREDIT' : 'DEBIT'}`}>
                {t.type === 'DEBIT' ? '−' : '+'}{fmt(Math.abs(t.amount))}
              </span>
              <span className="conjunto-txn-action">
                <button className="tag-mgmt-btn del" title="Remover do conjunto" onClick={() => removeTxn(t)}>✕</button>
              </span>
            </div>
          ))}
        </div>
      )}

      <div className="conjunto-add-search">
        <input type="text" placeholder="Buscar transação por descrição para adicionar…" value={search}
          onChange={e => setSearch(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && doSearch()} />
        <button className="cal-sort-btn" onClick={doSearch} disabled={searching}>{searching ? '…' : 'Buscar'}</button>
      </div>

      {searchResults !== null && (
        <div className="conjunto-txn-list" style={{ marginTop: 8 }}>
          {!shownResults.length ? (
            <div className="conjunto-txn-row"><span className="conjunto-txn-desc">Nenhuma transação encontrada.</span></div>
          ) : shownResults.map(t => {
            const already = (t.conjunto_ids || '').split(',').filter(Boolean).map(Number).includes(conjunto.id);
            return (
              <div key={t.id} className="conjunto-txn-row">
                <span className="conjunto-txn-date">{fmtDate(t.date)}</span>
                <span className="conjunto-txn-desc" title={t.description}>{t.description || '—'}</span>
                <span className="conjunto-txn-acc" title={t.account_name}>{t.account_name || '—'}</span>
                <span className={`conjunto-txn-amt ${t.type === 'CREDIT' ? 'CREDIT' : 'DEBIT'}`}>
                  {t.type === 'DEBIT' ? '−' : '+'}{fmt(Math.abs(t.amount))}
                </span>
                <span className="conjunto-txn-action">
                  <button className="cal-sort-btn" disabled={already} onClick={() => addTxn(t)}>
                    {already ? '✓' : '+ Add'}
                  </button>
                </span>
              </div>
            );
          })}
          {searchResults.length > 30 && (
            <div className="conjunto-txn-row" style={{color:'var(--muted)', fontSize:11}}>
              Mostrando 30 de {searchResults.length} resultados — refine a busca para ver outras.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── Conjuntos view: gerenciar conjuntos (agrupamentos de transações de um mesmo tema/evento pontual) ── */
function ConjuntosView({ conjuntos, onConjuntosChange }) {
  const [newName,   setNewName]   = useState('');
  const [newDesc,   setNewDesc]   = useState('');
  const [newColor,  setNewColor]  = useState('#64b5f6');
  const [editId,    setEditId]    = useState(null);
  const [editName,  setEditName]  = useState('');
  const [editDesc,  setEditDesc]  = useState('');
  const [editColor, setEditColor] = useState('');
  const [openId,    setOpenId]    = useState(null);

  async function addConjunto() {
    const name = newName.trim();
    if (!name) return;
    await fetch('/api/conjuntos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: newDesc.trim(), color: newColor }),
    });
    setNewName(''); setNewDesc('');
    onConjuntosChange();
  }

  async function saveEdit(id) {
    const name = editName.trim();
    if (!name) return;
    await fetch(`/api/conjuntos/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: editDesc.trim(), color: editColor }),
    });
    setEditId(null);
    onConjuntosChange();
  }

  async function deleteConjunto(id) {
    if (!confirm('Excluir este conjunto? As transações não serão apagadas, apenas deixam de pertencer a ele.')) return;
    await fetch(`/api/conjuntos/${id}`, { method: 'DELETE' });
    if (openId === id) setOpenId(null);
    onConjuntosChange();
  }

  function startEdit(cj) {
    setEditId(cj.id);
    setEditName(cj.name);
    setEditDesc(cj.description || '');
    setEditColor(cj.color);
  }

  return (
    <div className="conjuntos-view">
      <h2>Conjuntos</h2>
      <p className="conjuntos-hint">
        Um conjunto reúne transações de um mesmo evento pontual — por exemplo, um problema de saúde
        específico (consulta, exames, transporte). Diferente de tag: não é uma categoria recorrente
        usada mês a mês, é um agrupamento fechado que só existe uma vez.
      </p>
      <div className="conjuntos-grid">
        {!conjuntos.length && <div className="cal-no-txn">Nenhum conjunto criado ainda.</div>}
        {conjuntos.map(cj => (
          <div key={cj.id} className="conjunto-card">
            <div className="conjunto-card-hdr" onClick={() => setOpenId(openId === cj.id ? null : cj.id)}>
              {editId === cj.id ? (
                <div className="tag-inline-edit" onClick={e => e.stopPropagation()}>
                  <input type="color" value={editColor} onChange={e => setEditColor(e.target.value)} />
                  <input type="text" value={editName} onChange={e => setEditName(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveEdit(cj.id); if (e.key === 'Escape') setEditId(null); }} autoFocus />
                  <input type="text" placeholder="Descrição" value={editDesc} onChange={e => setEditDesc(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveEdit(cj.id); if (e.key === 'Escape') setEditId(null); }} />
                  <button className="tag-mgmt-btn" onClick={() => saveEdit(cj.id)} title="Salvar">✓</button>
                  <button className="tag-mgmt-btn" onClick={() => setEditId(null)} title="Cancelar">✕</button>
                </div>
              ) : (
                <>
                  <span className="tag-pill" style={{background: cj.color + '22', color: cj.color, borderColor: cj.color + '66'}}>
                    {cj.name}
                  </span>
                  <span className="conjunto-desc">{cj.description}</span>
                  <span className="conjunto-stats">
                    <span className="conjunto-total">{fmt(cj.total)}</span>
                    <span className="conjunto-count">{cj.txn_count} transaç{cj.txn_count === 1 ? 'ão' : 'ões'}</span>
                  </span>
                  <button className="tag-mgmt-btn" onClick={e => { e.stopPropagation(); startEdit(cj); }} title="Editar">✎</button>
                  <button className="tag-mgmt-btn del" onClick={e => { e.stopPropagation(); deleteConjunto(cj.id); }} title="Excluir">✕</button>
                  <span className="conjunto-caret">{openId === cj.id ? '▾' : '▸'}</span>
                </>
              )}
            </div>
            {openId === cj.id && <ConjuntoDetail conjunto={cj} onChange={onConjuntosChange} />}
          </div>
        ))}
      </div>
      <div className="tag-form" style={{ alignItems: 'flex-start' }}>
        <input type="color" value={newColor} onChange={e => setNewColor(e.target.value)} title="Cor" />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flex: 1 }}>
          <input type="text" placeholder="Nome do conjunto (ex: Problema de saúde — Março)" value={newName}
            onChange={e => setNewName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addConjunto()} />
          <input type="text" placeholder="Descrição (opcional)" value={newDesc}
            onChange={e => setNewDesc(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addConjunto()} />
        </div>
        <button onClick={addConjunto}>+ Criar conjunto</button>
      </div>
    </div>
  );
}

/* ── Contingência: importação manual de transações de cartão ── */
function ContingenciaView({ accounts, onChanged }) {
  const [files,   setFiles]   = useState([]);
  const [rows,    setRows]    = useState([]);
  const [selFile, setSelFile] = useState('');
  const [selAcc,  setSelAcc]  = useState('');
  const [busy,    setBusy]    = useState(false);
  const [notice,  setNotice]  = useState(null);
  const [error,   setError]   = useState(null);
  const [sel,     setSel]     = useState(() => new Set());
  const [amtDraft, setAmtDraft] = useState({});   // id -> string em edição

  const creditAccounts = useMemo(
    () => accounts.filter(a => !a.hidden).sort((a, b) =>
      (b.type === 'CREDIT') - (a.type === 'CREDIT') || (a.name || '').localeCompare(b.name || '')),
    [accounts]);

  async function loadFiles() {
    try {
      const r = await fetch('/api/contingencia/files');
      const d = await r.json();
      setFiles(d.results || []);
    } catch {}
  }
  async function loadRows() {
    try {
      const r = await fetch('/api/contingencia');
      const d = await r.json();
      setRows(d.results || []);
    } catch {}
  }
  useEffect(() => { loadFiles(); loadRows(); }, []);

  async function doImport() {
    if (!selFile || !selAcc) { setError('Selecione o arquivo e a conta.'); return; }
    setBusy(true); setError(null); setNotice(null);
    try {
      const r = await fetch('/api/contingencia/import', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: selFile, account_id: selAcc }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setNotice(`Importadas ${d.imported} (${d.skipped_existing} já existiam · ${d.international_pending} internacionais pendentes de valor)`);
      await loadRows();
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  }

  async function patchRow(id, body) {
    setError(null);
    const r = await fetch(`/api/contingencia/${id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.error) { setError(d.error); return null; }
    setRows(prev => prev.map(x => x.id === id ? d : x));
    onChanged && onChanged();
    return d;
  }

  async function delRow(id) {
    await fetch(`/api/contingencia/${id}`, { method: 'DELETE' });
    setRows(prev => prev.filter(x => x.id !== id));
    setSel(prev => { const n = new Set(prev); n.delete(id); return n; });
    onChanged && onChanged();
  }

  async function bulkDelete(payload, confirmMsg) {
    if (!confirm(confirmMsg)) return;
    const r = await fetch('/api/contingencia/delete-bulk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (d.error) { setError(d.error); return; }
    setSel(new Set());
    await loadRows();
    onChanged && onChanged();
  }

  async function bulkValidate() {
    const ids = [...sel];
    for (const id of ids) {
      const row = rows.find(x => x.id === id);
      if (row && !row.validada && row.amount != null) await patchRow(id, { validada: 1 });
    }
    setSel(new Set());
  }

  function toggleSel(id) {
    setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }

  function commitAmount(id) {
    const raw = amtDraft[id];
    if (raw === undefined) return;
    const norm = raw.replace(/\./g, '').replace(',', '.').trim();
    const val = norm === '' ? '' : parseFloat(norm);
    patchRow(id, { amount: val });
    setAmtDraft(prev => { const n = { ...prev }; delete n[id]; return n; });
  }

  const pend     = rows.filter(r => !r.validada).length;
  const val      = rows.filter(r => r.validada).length;
  const dups     = rows.filter(r => r.dup_suspeita).length;
  const dupsCont = rows.filter(r => r.dup_cont).length;
  const importedFiles = [...new Set(rows.map(r => r.source_file))];

  return (
    <div className="cont-view">
      <h2>Contingência — importação manual</h2>
      <p className="cont-hint">
        Para quando o Open Finance não retorna as transações do cartão. Cole o extrato do cartão
        num arquivo <code>.txt</code> dentro de <code>Contingencia/AAAAMM/</code> e importe aqui.
        Cada transação importada fica <b>marcada como contingência</b> e <b>só entra nos cálculos depois de validada</b> por você abaixo.
        Mesmo validada, continua sinalizada como contingência em todas as telas.
      </p>

      <div className="cont-import">
        <select value={selFile} onChange={e => setSelFile(e.target.value)}>
          <option value="">— arquivo —</option>
          {files.map(f => <option key={f.path} value={f.path}>{f.path}</option>)}
        </select>
        <select value={selAcc} onChange={e => setSelAcc(e.target.value)}>
          <option value="">— conta / cartão —</option>
          {creditAccounts.map(a => (
            <option key={a.id} value={a.id}>
              {a.type === 'CREDIT' ? '💳 ' : ''}{a.name} — {firstName(a.owner)}
              {a.txn_count != null ? ` · ${a.txn_count} txns` : ''}
              {a.last_txn ? ` · última ${fmtDate(a.last_txn)}` : ''}
            </option>
          ))}
        </select>
        <button onClick={doImport} disabled={busy || !selFile || !selAcc}>
          {busy ? 'Importando…' : 'Importar'}
        </button>
      </div>

      {error  && <div className="notif error">⚠ {error}</div>}
      {notice && !error && <div className="notif success">✓ {notice}</div>}

      {rows.length > 0 && (
        <>
          <div className="cont-summary">
            <span>Total: <b>{rows.length}</b></span>
            <span>Pendentes: <b>{pend}</b></span>
            <span>Validadas: <b>{val}</b></span>
            <span>Dup. c/ Pluggy: <b>{dups}</b></span>
            <span>Dup. entre contingências: <b>{dupsCont}</b></span>
          </div>
          <div className="cont-bulk">
            <button onClick={bulkValidate} disabled={!sel.size}>Validar selecionadas ({sel.size})</button>
            <button className="danger" onClick={() => bulkDelete({ ids: [...sel] }, `Excluir ${sel.size} transações de contingência selecionadas?`)} disabled={!sel.size}>
              Excluir selecionadas
            </button>
            {importedFiles.map(f => (
              <button key={f} className="danger" onClick={() => bulkDelete({ source_file: f }, `Excluir TODAS as transações de contingência importadas de "${f}"?`)}>
                Excluir tudo de {f}
              </button>
            ))}
            <button className="danger" onClick={() => bulkDelete({ all: true }, 'Excluir TODAS as transações de contingência?')}>
              Excluir todas
            </button>
          </div>

          <table className="cont-table">
            <thead>
              <tr>
                <th style={{width:24}}></th>
                <th style={{width:90}}>Data</th>
                <th>Descrição</th>
                <th style={{width:130}}>Conta</th>
                <th style={{width:110}}>Valor</th>
                <th style={{width:150}}>Status</th>
                <th style={{width:150}}>Ações</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => {
                const intl    = r.raw_currency !== 'BRL';
                const pending = r.amount == null;
                const draft   = amtDraft[r.id];
                return (
                  <tr key={r.id} className={`cont-row${r.validada ? ' validada' : ''}${(r.dup_suspeita || r.dup_cont) ? ' dup' : ''}`}>
                    <td><input type="checkbox" checked={sel.has(r.id)} onChange={() => toggleSel(r.id)} /></td>
                    <td className="dt" style={{fontFamily:'var(--mono)',color:'var(--muted)'}}>{fmtDate(r.date)}</td>
                    <td title={r.kind_label}>
                      {r.description}
                      {r.installment && <span style={{color:'var(--muted)'}}> ({r.installment})</span>}
                    </td>
                    <td style={{color:'var(--muted)'}}>{r.account_name}</td>
                    <td className={`amt ${r.type}`}>
                      {intl ? (
                        <input className={`amt-in${pending ? ' pending' : ''}`}
                          placeholder={`${r.raw_currency} ${r.raw_amount.toFixed(2)}`}
                          value={draft !== undefined ? draft : (r.amount != null ? String(r.amount).replace('.', ',') : '')}
                          onChange={e => setAmtDraft(p => ({ ...p, [r.id]: e.target.value }))}
                          onBlur={() => commitAmount(r.id)}
                          onKeyDown={e => e.key === 'Enter' && e.currentTarget.blur()} />
                      ) : (
                        <>{r.type === 'DEBIT' ? '−' : '+'}{fmt(r.amount)}</>
                      )}
                    </td>
                    <td>
                      {r.validada
                        ? <span className="cont-pill val">Validada</span>
                        : <span className="cont-pill pend">Pendente</span>}
                      {' '}
                      {intl && <span className="cont-pill intl">{r.raw_currency}</span>}
                      {' '}
                      {r.dup_suspeita ? <span className="cont-pill dup" title="Já existe uma transação Pluggy nessa conta, mesmo dia, mesmo valor e tipo">dup. Pluggy</span> : null}
                      {' '}
                      {r.dup_cont ? <span className="cont-pill dup" title="Outra transação de contingência com mesma conta, dia, valor e tipo — provavelmente veio de dois extratos">dup. contingência</span> : null}
                    </td>
                    <td>
                      <button className="cont-act-btn"
                        onClick={() => patchRow(r.id, { validada: r.validada ? 0 : 1 })}
                        disabled={!r.validada && pending}
                        title={!r.validada && pending ? 'Informe o valor em R$ antes de validar' : ''}>
                        {r.validada ? 'Desvalidar' : 'Validar'}
                      </button>
                      {' '}
                      <button className="cont-act-btn del" onClick={() => delRow(r.id)}>Excluir</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </>
      )}
      {rows.length === 0 && (
        <div className="cal-no-txn">Nenhuma transação de contingência importada.</div>
      )}
    </div>
  );
}

/* ── Monthly Expenses View ── */
function MonthlyExpensesView({ tags, dateFrom, dateTo, conjuntos }) {
  const [txns,       setTxns]       = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [tagPopover, setTagPopover] = useState(null);
  const [sortField,  setSortField]  = useState('date');
  const [sortDir,    setSortDir]    = useState('asc');

  useEffect(() => {
    if (!tagPopover) return;
    const close = () => setTagPopover(null);
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [tagPopover]);

  useEffect(() => {
    async function load() {
      setLoading(true);
      try {
        const r = await fetch(`/api/transactions?from=${dateFrom}&to=${dateTo}`);
        const d = await r.json();
        setTxns(d.results || []);
      } catch {} finally { setLoading(false); }
    }
    load();
  }, [dateFrom, dateTo]);

  const tagMap = useMemo(() => Object.fromEntries(tags.map(t => [t.id, t])), [tags]);

  const { duplicatePairs, suspectedDuplicateIds } = useMemo(() => {
    const pairs = [];
    const ids   = new Set();
    const seen  = new Set();
    const candidates = txns.filter(t => !t.ignored);
    for (let i = 0; i < candidates.length; i++) {
      for (let j = i + 1; j < candidates.length; j++) {
        const a = candidates[i], b = candidates[j];
        if (a.type !== b.type) continue;
        if (a.account_name !== b.account_name) continue;
        if (Math.round(Math.abs(parseFloat(a.amount)) * 100) !== Math.round(Math.abs(parseFloat(b.amount)) * 100)) continue;
        const diffDays = Math.abs((new Date(a.date.slice(0,10)) - new Date(b.date.slice(0,10))) / 86400000);
        if (diffDays <= 2) {
          const key = [a.id, b.id].sort().join('|');
          if (!seen.has(key)) {
            seen.add(key);
            // sort pair so earlier date comes first
            pairs.push(a.date <= b.date ? [a, b] : [b, a]);
            ids.add(a.id);
            ids.add(b.id);
          }
        }
      }
    }
    return { duplicatePairs: pairs, suspectedDuplicateIds: ids };
  }, [txns]);

  const taggedFixed   = useMemo(() => txns.filter(t => !t.ignored && t.is_fixed), [txns]);
  const taggedFree    = useMemo(() => txns.filter(t => t.tag_ids && t.tag_ids !== '' && !t.ignored && !t.is_fixed), [txns]);
  const ignoredTxns   = useMemo(() => txns.filter(t => t.ignored), [txns]);

  // Conjuntos com pelo menos 1 transação (não ignorada) dentro do período selecionado
  const conjuntoStats = useMemo(() => {
    if (!conjuntos || !conjuntos.length) return [];
    const map = {}; // conjunto_id -> { total, count }
    txns.filter(t => !t.ignored).forEach(t => {
      const ids = (t.conjunto_ids || '').split(',').filter(Boolean).map(Number);
      if (!ids.length) return;
      const amt = t.type === 'CREDIT' ? -Math.abs(parseFloat(t.amount) || 0) : Math.abs(parseFloat(t.amount) || 0);
      ids.forEach(cid => {
        if (!map[cid]) map[cid] = { total: 0, count: 0 };
        map[cid].total += amt;
        map[cid].count += 1;
      });
    });
    return conjuntos
      .filter(cj => map[cj.id])
      .map(cj => ({ ...cj, periodTotal: map[cj.id].total, periodCount: map[cj.id].count }))
      .sort((a, b) => b.periodTotal - a.periodTotal);
  }, [txns, conjuntos]);

  function onSort(f) {
    if (sortField === f) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortField(f); setSortDir('asc'); }
  }
  const arrow = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  function sortList(list) {
    return [...list].sort((a, b) => {
      if (sortField === 'amount') {
        const sa = a.type === 'CREDIT' ? parseFloat(a.amount) : -Math.abs(parseFloat(a.amount));
        const sb = b.type === 'CREDIT' ? parseFloat(b.amount) : -Math.abs(parseFloat(b.amount));
        return sortDir === 'asc' ? sa - sb : sb - sa;
      }
      const cmp = String(a[sortField] ?? '').localeCompare(String(b[sortField] ?? ''), 'pt-BR', { sensitivity: 'base' });
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }

  const sortedFixed   = useMemo(() => sortList(taggedFixed),   [taggedFixed,   sortField, sortDir]);
  const sortedFree    = useMemo(() => sortList(taggedFree),    [taggedFree,    sortField, sortDir]);
  const sortedIgnored = useMemo(() => sortList(ignoredTxns),   [ignoredTxns,   sortField, sortDir]);

  const grandTotalFixed = useMemo(() =>
    taggedFixed.filter(t => t.type !== 'CREDIT').reduce((s, t) => s + Math.abs(parseFloat(t.amount) || 0), 0),
  [taggedFixed]);

  const grandTotalFree = useMemo(() =>
    taggedFree.filter(t => t.type !== 'CREDIT').reduce((s, t) => s + Math.abs(parseFloat(t.amount) || 0), 0),
  [taggedFree]);

  const grandTotalIgnored = useMemo(() =>
    ignoredTxns.filter(t => t.type !== 'CREDIT').reduce((s, t) => s + Math.abs(parseFloat(t.amount) || 0), 0),
  [ignoredTxns]);

  function parseTxnTagIds(t) {
    return (t.tag_ids || '').split(',').filter(Boolean).map(Number);
  }

  async function toggleTxnTag(txnId, tagId) {
    const txn     = txns.find(t => t.id === txnId);
    const current = parseTxnTagIds(txn);
    const next    = current.includes(tagId) ? current.filter(x => x !== tagId) : [...current, tagId];
    const r = await fetch(`/api/transactions/${txnId}/tags`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tag_ids: next }),
    });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, tag_ids: d.tag_ids } : t));
  }

  async function toggleFixed(txnId) {
    const r = await fetch(`/api/transactions/${txnId}/fixed`, { method: 'POST' });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, is_fixed: d.is_fixed ? 1 : 0 } : t));
  }

  function renderTable(sortedList) {
    return (
      <div className="cal-txn-list me-list">
        <div className="cal-txn-hdr me-hdr">
          <span />
          <span className={`sortable${sortField==='date'?' sorted':''}`} onClick={() => onSort('date')}>Data{arrow('date')}</span>
          <span className={`sortable${sortField==='description'?' sorted':''}`} onClick={() => onSort('description')}>Descrição{arrow('description')}</span>
          <span>Tags</span>
          <span className={`sortable${sortField==='category'?' sorted':''}`} onClick={() => onSort('category')}>Categoria{arrow('category')}</span>
          <span className={`sortable${sortField==='owner_name'?' sorted':''}`} onClick={() => onSort('owner_name')}>Dono{arrow('owner_name')}</span>
          <span className={`sortable${sortField==='account_name'?' sorted':''}`} onClick={() => onSort('account_name')}>Conta{arrow('account_name')}</span>
          <span className={`right sortable${sortField==='amount'?' sorted':''}`} onClick={() => onSort('amount')}>Valor{arrow('amount')}</span>
        </div>
        {sortedList.map(t => {
          const txnTagIds = parseTxnTagIds(t);
          const txnTags   = txnTagIds.map(id => tagMap[id]).filter(Boolean);
          const isOpen    = tagPopover?.txnId === t.id;
          const amt       = Math.abs(parseFloat(t.amount) || 0);
          const clr       = t.type === 'CREDIT' ? 'var(--green)' : t.is_fixed ? '#9c6fe4' : 'var(--red)';
          const sgn       = t.type === 'CREDIT' ? '+' : '−';
          const isDup     = suspectedDuplicateIds.has(t.id);
          return (
            <div key={t.id} className={`cal-txn-row me-row${t.ignored ? ' ignored' : ''}${t.is_fixed ? ' fixed' : ''}${isDup ? ' dup-suspect' : ''}`}>
              <button className="cal-txn-fixed-btn"
                title={t.is_fixed ? 'Marcar como discricionário' : 'Marcar como vinculado'}
                onClick={() => toggleFixed(t.id)}>
                {t.is_fixed ? '⬡' : '◇'}
              </button>
              <span className="cal-txn-cat" style={{color:'var(--muted)'}}>{localDay(t.date)}</span>
              <div style={{display:'flex',alignItems:'center',gap:4,overflow:'hidden',minWidth:0}}>
                <span className="cal-txn-desc" title={t.description}>{t.description || '—'}</span>
                {isDup && <span className="dup-badge" title="Possível duplicata: mesmo valor na mesma conta em data próxima">⚠</span>}
              </div>
              <div className="cal-txn-tags">
                {txnTags.map(tg => (
                  <span key={tg.id} className="tag-pill"
                    style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66'}}
                    title={`Remover: ${tg.name}`}
                    onClick={e => { e.stopPropagation(); toggleTxnTag(t.id, tg.id); }}>
                    {tg.name}
                  </span>
                ))}
                <button className="tag-add-btn" title="Editar tags"
                  onClick={e => {
                    e.stopPropagation();
                    if (isOpen) { setTagPopover(null); return; }
                    const rect = e.currentTarget.getBoundingClientRect();
                    setTagPopover({ txnId: t.id, top: rect.bottom + 4, left: rect.left });
                  }}>
                  {isOpen ? '✕' : '+'}
                </button>
              </div>
              <span className="cal-txn-cat">{t.category || '—'}</span>
              <span className="cal-txn-owner" style={{color: ownerColor(t.owner_name)}}>{firstName(t.owner_name) || '—'}</span>
              <span className="cal-txn-acc">{t.account_name || '—'}</span>
              <span className={`cal-txn-amt ${t.type}`} style={{color: clr}}>{sgn}{fmt(amt)}</span>
            </div>
          );
        })}
      </div>
    );
  }

  return (
    <div className="me-view">
      {loading && <span className="spin" style={{alignSelf:'flex-start'}} />}

      {conjuntoStats.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <h3 style={{ margin: '0 0 8px 0', fontSize: 16 }}>Conjuntos no período</h3>
          <div className="conjuntos-grid" style={{ marginBottom: 0 }}>
            {conjuntoStats.map(cj => (
              <div key={cj.id} className="conjunto-card">
                <div className="conjunto-card-hdr static">
                  <span className="tag-pill" style={{background: cj.color+'22', color: cj.color, borderColor: cj.color+'66'}}>
                    {cj.name}
                  </span>
                  <span className="conjunto-desc">{cj.description}</span>
                  <span className="conjunto-stats">
                    <span className="conjunto-total">{fmt(cj.periodTotal)}</span>
                    <span className="conjunto-count">{cj.periodCount} transaç{cj.periodCount === 1 ? 'ão' : 'ões'} no período</span>
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '0 0 8px 0' }}>
        <h3 style={{ margin: 0, fontSize: 16 }}>Transações com Tags — Vinculadas</h3>
        {!loading && sortedFixed.length > 0 && (
          <span style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:'#9c6fe4'}}>
            −{fmt(grandTotalFixed)}
          </span>
        )}
      </div>
      {!loading && sortedFixed.length === 0 ? (
        <div className="cal-no-txn">Nenhuma transação vinculada com tag no período selecionado.</div>
      ) : (
        renderTable(sortedFixed)
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '24px 0 8px 0' }}>
        <h3 style={{ margin: 0, fontSize: 16 }}>Transações com Tags — Discricionárias</h3>
        {!loading && sortedFree.length > 0 && (
          <span style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:'var(--red)'}}>
            −{fmt(grandTotalFree)}
          </span>
        )}
      </div>
      {!loading && sortedFree.length === 0 ? (
        <div className="cal-no-txn">Nenhuma transação discricionária com tag no período selecionado.</div>
      ) : (
        renderTable(sortedFree)
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '24px 0 8px 0' }}>
        <h3 style={{ margin: 0, fontSize: 16 }}>Transações Ignoradas</h3>
        {!loading && sortedIgnored.length > 0 && (
          <span style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:'var(--red)'}}>
            −{fmt(grandTotalIgnored)}
          </span>
        )}
      </div>
      {!loading && sortedIgnored.length === 0 ? (
        <div className="cal-no-txn">Nenhuma transação ignorada no período selecionado.</div>
      ) : (
        renderTable(sortedIgnored)
      )}

      {tagPopover && (() => {
        const txn       = txns.find(t => t.id === tagPopover.txnId);
        const txnTagIds = txn ? parseTxnTagIds(txn) : [];
        return (
          <div className="tag-selector"
            style={{top: tagPopover.top, left: tagPopover.left}}
            onClick={e => e.stopPropagation()}>
            <div className="tag-selector-title">Tags</div>
            {tags.map(tg => (
              <label key={tg.id} className="tag-selector-item">
                <input type="checkbox"
                  checked={txnTagIds.includes(tg.id)}
                  onChange={() => toggleTxnTag(tagPopover.txnId, tg.id)} />
                <span className="tag-pill"
                  style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66'}}>
                  {tg.name}
                </span>
              </label>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

/* ── Carteira / AtivosView ── */

const INDEXADORES = ['CDI', 'IPCA', 'SELIC', 'Prefixado', 'IGPM', 'Dólar', 'Outro'];
const SUBTYPES_LABELS = {
  TREASURY:'Tesouro', CDB:'CDB', LCI:'LCI', LCA:'LCA', DEBENTURES:'Debêntures',
  CRI:'CRI', CRA:'CRA', STOCK:'Ação', STOCK_FUND:'FII',
  INVESTMENT_FUND:'Fundo Inv.', MUTUAL_FUND:'Multimercado', ETF:'ETF', OTHER:'Outro',
};

function inferRendaTipo(inv) {
  if (!inv) return 'FIXA';
  if (inv.type === 'FIXED_INCOME') return 'FIXA';
  return 'VARIAVEL';
}

function defaultIndexador(inv) {
  if (!inv || inv.type !== 'FIXED_INCOME') return '';
  const sub = (inv.subtype || '').toUpperCase();
  if (sub === 'TREASURY') return 'IPCA';
  if (sub === 'CDB' || sub === 'LCI' || sub === 'LCA') return 'CDI';
  return '';
}

function AtivoFormModal({ mode, initial, pluggyInv, onSave, onClose }) {
  // mode: 'add' | 'edit' | 'import'
  const fromInv = pluggyInv || {};
  const base    = initial || {};
  const isEdit  = mode === 'edit';

  const [name,       setName]       = useState(base.name       || fromInv.name        || '');
  const [subtype,    setSubtype]    = useState(base.subtype    || fromInv.subtype      || '');
  const [rendaTipo,  setRendaTipo]  = useState(base.renda_tipo || inferRendaTipo(fromInv));
  const [indexador,  setIndexador]  = useState(base.indexador  || defaultIndexador(fromInv) || '');
  const [indexCustom,setIndexCustom]= useState('');
  const [vencimento, setVencimento] = useState(
    base.vencimento
    || (fromInv.due_date ? fromInv.due_date.substring(0, 10) : '')
  );
  const [balance,    setBalance]    = useState(base.balance    ?? fromInv.balance    ?? '');
  const [amount,     setAmount]     = useState(base.amount     ?? fromInv.amount     ?? '');
  const [annualRate, setAnnualRate] = useState(base.annual_rate ?? fromInv.annual_rate ?? '');
  const [quantity,   setQuantity]   = useState(base.quantity   ?? fromInv.quantity   ?? '');
  const [code,       setCode]       = useState(base.code       || fromInv.code        || '');
  const [isin,       setIsin]       = useState(base.isin       || fromInv.isin        || '');
  const [institution,setInstitution]= useState(base.institution|| fromInv.institution || '');
  const [owner,      setOwner]      = useState(base.owner      || fromInv.owner       || '');
  const [status,        setStatus]        = useState(base.status        || 'ACTIVE');
  const [periodicidade,  setPeriodicidade]  = useState(base.periodicidade  || '');
  const [dy,             setDy]             = useState(base.dy             ?? '');
  const [dataPagamento,  setDataPagamento]  = useState(base.data_pagamento || '');
  const [liquidez,       setLiquidez]       = useState(!!base.liquidez);
  const [saving,        setSaving]        = useState(false);
  const [error,         setError]         = useState(null);

  const idxValue = indexador === 'Outro' ? indexCustom : indexador;

  async function handleSave() {
    if (!name.trim()) { setError('Nome é obrigatório'); return; }
    setSaving(true); setError(null);
    const payload = {
      name: name.trim(), subtype, renda_tipo: rendaTipo, indexador: idxValue,
      vencimento, balance: parseFloat(balance) || 0, amount: parseFloat(amount) || 0,
      annual_rate: annualRate !== '' ? parseFloat(annualRate) : null,
      quantity: quantity !== '' ? parseFloat(quantity) : null,
      code, isin, institution, owner, status,
      periodicidade, dy: dy !== '' ? parseFloat(dy) : null,
      data_pagamento: dataPagamento,
      liquidez,
    };
    if (mode === 'import') payload.pluggy_id = fromInv.id;
    await onSave(payload, isEdit ? base.id : null);
    setSaving(false);
  }

  const title = mode === 'add' ? 'Adicionar Ativo' : mode === 'edit' ? 'Editar Ativo' : `Importar — ${fromInv.name || ''}`;

  return (
    <div className="aform-overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="aform-box">
        <div className="aform-hdr">
          <span className="aform-title">{title}</span>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="aform-body">
          {mode === 'import' && (
            <div className="aform-warn">
              Revise os dados pré-preenchidos e preencha <strong>Indexador</strong> e <strong>Vencimento</strong> antes de confirmar a importação.
            </div>
          )}

          <div className="aform-section-title">Identificação</div>
          <div className="aform-row">
            <div className="aform-field">
              <label className="aform-label">Nome *</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Ex: CDB Banco Pan" />
            </div>
          </div>
          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Instituição</label>
              <input value={institution} onChange={e => setInstitution(e.target.value)} placeholder="Ex: XP, BTG…" />
            </div>
            <div className="aform-field">
              <label className="aform-label">Titular</label>
              <input value={owner} onChange={e => setOwner(e.target.value)} placeholder="Anderson / Nadia" />
            </div>
          </div>

          <div className="aform-section-title">Classificação</div>
          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Renda</label>
              <select value={rendaTipo} onChange={e => setRendaTipo(e.target.value)}>
                <option value="FIXA">Renda Fixa</option>
                <option value="VARIAVEL">Renda Variável</option>
              </select>
            </div>
            <div className="aform-field">
              <label className="aform-label">Subtipo</label>
              <select value={subtype} onChange={e => setSubtype(e.target.value)}>
                <option value="">—</option>
                {Object.entries(SUBTYPES_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
              </select>
            </div>
          </div>
          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Indexador</label>
              <select value={indexador} onChange={e => setIndexador(e.target.value)}>
                <option value="">—</option>
                {INDEXADORES.map(i => <option key={i} value={i}>{i}</option>)}
              </select>
            </div>
            {indexador === 'Outro' && (
              <div className="aform-field">
                <label className="aform-label">Indexador personalizado</label>
                <input value={indexCustom} onChange={e => setIndexCustom(e.target.value)} placeholder="Ex: INPC, TJLP…" />
              </div>
            )}
            <div className="aform-field">
              <label className="aform-label">Vencimento</label>
              <input type="date" value={vencimento} onChange={e => setVencimento(e.target.value)} />
            </div>
          </div>

          <div className="aform-section-title">Valores</div>
          <div className="aform-row cols2">
            <div className="aform-field">
              <label className="aform-label">Valor Atual (R$)</label>
              <input type="number" step="0.01" value={balance} onChange={e => setBalance(e.target.value)} placeholder="0,00" />
            </div>
            <div className="aform-field">
              <label className="aform-label">Valor Investido (R$)</label>
              <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0,00" />
            </div>
          </div>
          <div className="aform-row cols3">
            <div className="aform-field">
              <label className="aform-label">Taxa Anual (%)</label>
              <input type="number" step="0.01" value={annualRate} onChange={e => setAnnualRate(e.target.value)} placeholder="Ex: 12.5" />
            </div>
            <div className="aform-field">
              <label className="aform-label">Quantidade</label>
              <input type="number" step="0.000001" value={quantity} onChange={e => setQuantity(e.target.value)} placeholder="0" />
            </div>
            <div className="aform-field">
              <label className="aform-label">Status</label>
              <select value={status} onChange={e => setStatus(e.target.value)}>
                <option value="ACTIVE">Ativo</option>
                <option value="REDEEMED">Resgatado</option>
                <option value="MATURED">Vencido</option>
              </select>
            </div>
          </div>

          <div className="aform-section-title">Renda</div>
