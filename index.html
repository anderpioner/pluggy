<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos da Família — Pluggy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0c0f;--bg2:#111418;--bg3:#181d23;--bg4:#1e242c;
  --border:#1f2833;--border2:#2a3441;
  --text:#e8f0f8;--muted:#8899aa;
  --accent:#00d4aa;
  --green:#26a69a;--green-dim:rgba(38,166,154,0.12);
  --red:#ef5350;--red-dim:rgba(239,83,80,0.12);
  --yellow:#f5c842;--blue:#4a90d9;--blue-dim:rgba(74,144,217,0.12);
  --mono:'SF Mono','Fira Code','Consolas',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;}

/* ── Layout ── */
.app{display:flex;flex-direction:column;min-height:100vh;}
.app-body{display:grid;grid-template-columns:260px 1fr;}

/* ── TopBar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;
}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;}
.vsep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.topbar label{font-size:10px;color:var(--muted);font-family:var(--mono);}
.topbar input[type="date"]{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  font-size:11px;padding:4px 7px;border-radius:3px;outline:none;font-family:var(--mono);
}
.topbar input[type="date"]:focus{border-color:var(--accent);}
.spacer{flex:1;}
.preset-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--muted);
  font-size:10px;padding:3px 9px;border-radius:3px;cursor:pointer;font-family:var(--mono);
}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,0.08);}

/* ── Sync button ── */
.sync-btn{
  background:var(--accent);color:#000;border:none;padding:5px 14px;
  border-radius:3px;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--mono);
  white-space:nowrap;
}
.sync-btn:hover{background:#00b891;}
.sync-btn:disabled{opacity:0.5;cursor:not-allowed;}
.sync-btn.full{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
.sync-btn.full:hover{border-color:var(--accent);color:var(--accent);}
.sync-info{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap;}
.sync-info span{color:var(--accent);}

/* ── Notification bars ── */
.notif{padding:5px 16px;font-size:11px;font-family:var(--mono);}
.notif.error{background:var(--red-dim);color:var(--red);border-bottom:1px solid rgba(239,83,80,0.25);}
.notif.status{background:var(--blue-dim);color:var(--blue);border-bottom:1px solid rgba(74,144,217,0.25);}
.notif.success{background:var(--green-dim);color:var(--green);border-bottom:1px solid rgba(38,166,154,0.25);}

/* ── Summary row ── */
.summary-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);border-bottom:2px solid var(--border);
}
.s-card{background:var(--bg2);padding:10px 16px;}
.s-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-family:var(--mono);margin-bottom:3px;}
.s-value{font-size:17px;font-family:var(--mono);font-weight:700;}
.s-value.green{color:var(--green);}
.s-value.red{color:var(--red);}
.s-value.blue{color:var(--blue);}

/* ── Left panel ── */
.left-panel{
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.left-panel::-webkit-scrollbar{width:3px;}
.left-panel::-webkit-scrollbar-thumb{background:var(--border2);}
.panel-title{
  font-size:9px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);font-family:var(--mono);padding:10px 12px 5px;
}
.acc-item{
  padding:8px 12px;cursor:pointer;border-left:2px solid transparent;transition:background 0.1s;
}
.acc-item:hover{background:var(--bg3);}
.acc-item.sel{background:rgba(0,212,170,0.07);border-left-color:var(--accent);}
.acc-badge{
  font-size:8px;padding:1px 5px;border-radius:2px;font-family:var(--mono);
  text-transform:uppercase;display:inline-block;margin-bottom:2px;
}
.acc-badge.BANK{background:var(--blue-dim);color:var(--blue);}
.acc-badge.CREDIT{background:var(--red-dim);color:var(--red);}
.acc-inst{font-size:9px;color:var(--muted);font-family:var(--mono);}
.acc-name{font-size:12px;color:var(--text);margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc-balance{font-size:12px;font-family:var(--mono);font-weight:600;}
.acc-owner{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc-hidden-btn{
  background:none;border:none;cursor:pointer;font-size:11px;padding:2px 5px;
  border-radius:2px;color:var(--muted);float:right;margin-top:-18px;opacity:0;
  transition:opacity 0.15s;
}
.acc-item:hover .acc-hidden-btn{opacity:1;}
.acc-item.hidden-acc{opacity:0.4;}
.acc-item.hidden-acc .acc-hidden-btn{opacity:1;color:var(--accent);}
.hidden-toggle{
  font-size:9px;font-family:var(--mono);color:var(--muted);
  padding:6px 12px;cursor:pointer;text-decoration:underline;
}
.hidden-toggle:hover{color:var(--accent);}

/* ── Chart ── */
.chart-section{padding:8px 10px;flex:1;}
.chart-wrap{position:relative;height:170px;}
.cat-legend{margin-top:8px;}
.cat-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10px;font-family:var(--mono);}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cat-name{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-val{color:var(--text);}

/* ── Right panel ── */
.right-panel{display:flex;flex-direction:column;}
.tbl-controls{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:7px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex-shrink:0;
}
.tbl-controls select,.tbl-controls input{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  font-size:11px;padding:4px 7px;border-radius:3px;outline:none;font-family:var(--mono);
}
.tbl-controls select:focus,.tbl-controls input:focus{border-color:var(--accent);}
.tbl-controls input[type="text"]{min-width:150px;}
.txn-count{font-size:10px;color:var(--muted);font-family:var(--mono);margin-left:auto;}

/* ── Table ── */
.tbl-wrap{}
.tbl-wrap::-webkit-scrollbar{width:4px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border2);}
table{width:100%;border-collapse:collapse;}
thead th{
  background:var(--bg3);border-bottom:1px solid var(--border);
  padding:6px 10px;text-align:left;font-size:9px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  cursor:pointer;white-space:nowrap;position:sticky;top:0;user-select:none;z-index:1;
}
thead th:hover{color:var(--accent);}
thead th.sorted{color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--bg3);}
td{padding:5px 10px;font-size:12px;}
td.dt{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap;}
td.desc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
td.cat{font-size:10px;font-family:var(--mono);color:var(--muted);white-space:nowrap;}
td.acc{font-size:10px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
td.amt{font-family:var(--mono);font-weight:600;font-size:12px;text-align:right;white-space:nowrap;}
td.amt.DEBIT{color:var(--red);}
td.amt.CREDIT{color:var(--green);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:12px;}
.empty .empty-action{
  margin-top:16px;display:inline-block;background:var(--accent);color:#000;
  border:none;padding:8px 20px;border-radius:3px;cursor:pointer;
  font-size:12px;font-weight:600;font-family:var(--mono);
}

/* ── Spinner ── */
@keyframes spin{to{transform:rotate(360deg);}}
.spin{
  display:inline-block;width:11px;height:11px;
  border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.7s linear infinite;
  margin-right:5px;vertical-align:middle;
}

/* ── Tabs ── */
.tab-bar{
  display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;
}
.tab-btn{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-size:11px;font-family:var(--mono);
  padding:7px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-bottom:-1px;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── Calendar container ── */
.cal-container{display:flex;flex-direction:column;}
.cal-toolbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;
}
.cal-check-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.cal-check-label input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;}
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-nav-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.cal-month-label{font-size:13px;font-family:var(--mono);color:var(--text);min-width:170px;text-align:center;}

.cal-body{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}

/* ── Calendar grid ── */
.cal-chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.cal-chart-title{font-size:10px;color:var(--muted);font-family:var(--mono);padding:8px 16px 0;}
.cal-grid-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
.cal-dow{
  background:var(--bg3);padding:8px 4px;text-align:center;
  font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted);
}
.cal-cell{
  background:var(--bg2);min-height:72px;padding:6px 8px;cursor:pointer;
  transition:background 0.1s;display:flex;flex-direction:column;gap:2px;
}
.cal-cell:hover{background:var(--bg3);}
.cal-cell.pad{background:var(--bg);cursor:default;}
.cal-cell.today{background:rgba(0,212,170,0.06);}
.cal-cell.today .cal-day-n{color:var(--accent);font-weight:700;}
.cal-cell.sel{background:rgba(0,212,170,0.13);outline:1px solid var(--accent);outline-offset:-1px;}
.cal-day-n{font-size:11px;color:var(--muted);font-family:var(--mono);}
.cal-inc{font-size:10px;color:var(--green);font-family:var(--mono);font-weight:600;}
.cal-exp{font-size:10px;color:var(--red);font-family:var(--mono);font-weight:600;}

/* ── Day detail panel ── */
.cal-detail{background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.cal-txn-list{}
.cal-detail-hdr{
  padding:9px 14px;background:var(--bg3);border-bottom:1px solid var(--border);
  font-size:12px;display:flex;justify-content:space-between;align-items:center;
}
.cal-detail-hdr .cal-detail-date{color:var(--text);text-transform:capitalize;}
.cal-detail-summary{display:flex;gap:14px;font-family:var(--mono);font-size:12px;font-weight:600;}
.cal-sort-btns{display:flex;gap:4px;}
.cal-sort-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:3px;font-size:10px;font-family:var(--mono);cursor:pointer;}
.cal-sort-btn.active{border-color:var(--accent);color:var(--accent);}

/* ── Monthly charts month chips ── */
.mc-months{display:flex;flex-wrap:wrap;gap:6px;}
.mc-month-chip{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:4px 12px;border-radius:12px;font-size:10px;font-family:var(--mono);
  cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;
}
.mc-month-chip:hover{border-color:var(--accent);}
.mc-month-chip.off{color:var(--muted);opacity:0.4;text-decoration:line-through;}

/* ── Origem dos gastos (por dono / conta / cartão) ── */
.origin-owner-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;}
.origin-owner-name{font-size:12px;font-weight:600;}
.origin-owner-total{font-family:var(--mono);font-size:11px;}
.origin-owner-total .pct{color:var(--muted);}
.origin-subtitle{font-size:9px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;padding:6px 16px 2px;}

/* ── Monthly charts month range slider ── */
.mc-range{padding:2px 16px 12px;}
.mc-range-track-wrap{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;}
.mc-range-track{position:absolute;left:0;right:0;height:4px;background:var(--bg4);border-radius:2px;}
.mc-range-fill{position:absolute;height:4px;background:var(--accent);border-radius:2px;}
.mc-range-handle{
  position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);transform:translate(-50%,-50%);
  cursor:grab;box-shadow:0 0 0 1px var(--accent),0 1px 3px rgba(0,0,0,0.5);z-index:2;
}
.mc-range-handle:active{cursor:grabbing;}
/* Labels posicionadas nos mesmos pontos percentuais das alças (i/steps), não em
   flexbox — assim ficam exatamente acima da posição que representam. */
.mc-range-labels{position:relative;height:12px;margin-top:5px;}
.mc-range-labels span{
  position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;
  font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;
}
.mc-range-labels span.active{color:var(--text);}
.mc-day-range-readout{font-size:10px;font-family:var(--mono);color:var(--text);margin-bottom:4px;}
.cal-sort-btn:hover{border-color:var(--border2);}
.cal-no-txn{padding:14px;color:var(--muted);font-size:11px;font-family:var(--mono);}
.cal-txn-hdr{
  display:grid;grid-template-columns:22px 22px 1fr 170px 150px 100px 65px 120px 90px;
  padding:4px 14px;background:var(--bg3);border-bottom:1px solid var(--border2);align-items:center;gap:10px;
  position:sticky;top:0;z-index:1;
}
.cal-txn-hdr span{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-txn-hdr span.right{text-align:right;}
.cal-txn-row{
  display:grid;grid-template-columns:22px 22px 1fr 170px 150px 100px 65px 120px 90px;
  padding:6px 14px;border-bottom:1px solid var(--border);align-items:center;gap:10px;
}
.cal-txn-row:last-child{border-bottom:none;}
.cal-txn-row:hover{background:var(--bg3);}
.cal-txn-row.ignored{opacity:0.4;}
.cal-txn-row.ignored .cal-txn-amt{text-decoration:line-through;}
.cal-txn-ignore-btn{background:none;border:none;cursor:pointer;color:var(--border2);font-size:15px;line-height:1;padding:0;text-align:center;}
.cal-txn-ignore-btn:hover{color:var(--red);}
.cal-txn-row.ignored .cal-txn-ignore-btn{color:var(--accent);}
.cal-txn-fixed-btn{background:none;border:none;cursor:pointer;color:var(--border2);font-size:13px;line-height:1;padding:0;text-align:center;}
.cal-txn-fixed-btn:hover{color:#b39ddb;}
.cal-txn-row.fixed .cal-txn-fixed-btn{color:#9c6fe4;}
.cal-txn-row.fixed .cal-txn-amt.DEBIT{color:#9c6fe4;}
.cal-exp-fixed{font-size:10px;color:#9c6fe4;font-family:var(--mono);font-weight:600;}
.cal-txn-desc{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-txn-cat{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-txn-owner{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-txn-acc{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-txn-amt{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right;white-space:nowrap;}
.cal-txn-amt.DEBIT{color:var(--red);}
.cal-txn-amt.CREDIT{color:var(--green);}

/* ── Tags ── */
.tag-pill{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid;white-space:nowrap;line-height:1.6;cursor:default;}
.tag-add-btn{background:none;border:1px dashed var(--border2);border-radius:10px;color:var(--muted);font-size:10px;padding:1px 6px;cursor:pointer;line-height:1.6;flex-shrink:0;}
.tag-add-btn:hover{border-color:var(--accent);color:var(--accent);}
.cal-txn-tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tag-selector{position:fixed;z-index:9999;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.6);max-height:280px;overflow-y:auto;}
.tag-selector{position:absolute;top:calc(100% + 4px);left:0;z-index:300;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.tag-selector-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600;}
.tag-selector-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12px;}
.tag-selector-item:hover{background:var(--bg2);}
.tag-selector-item input{cursor:pointer;}
/* ── Monthly expenses view */
.me-view{padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;height:100%;}
.me-toolbar{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.me-toolbar select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:5px;font-size:13px;cursor:pointer;}
.me-list{border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.me-hdr,.me-row{grid-template-columns:22px 80px 1fr 170px 100px 65px 120px 90px !important;}
.me-hdr span.sortable{cursor:pointer;user-select:none;}
.me-hdr span.sortable:hover{color:var(--text);}
.me-hdr span.sorted{color:var(--accent)!important;}
.me-row.dup-suspect{background:rgba(230,168,23,0.07)!important;}
.dup-badge{flex-shrink:0;font-size:11px;color:#e6a817;cursor:default;}
.dup-section{background:rgba(230,168,23,0.07);border:1px solid rgba(230,168,23,0.25);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.dup-section-title{font-size:12px;font-weight:700;color:#e6a817;margin:0;}
.dup-pair{display:grid;grid-template-columns:1fr 18px 1fr 90px 110px;gap:8px;align-items:center;font-size:11px;color:var(--text);}
.dup-pair-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dup-pair-date{color:var(--muted);font-family:var(--mono);white-space:nowrap;}
.dup-pair-vs{color:var(--muted);text-align:center;}
.dup-pair-amt{font-family:var(--mono);color:var(--red);text-align:right;white-space:nowrap;}
.dup-pair-acc{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Tags management view */

/* Asset form modal */

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const fmt       = v => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const firstName   = s => s ? s.trim().split(/\s+/)[0].charAt(0).toUpperCase() + s.trim().split(/\s+/)[0].slice(1).toLowerCase() : '';
const ownerColor  = name => ({ Anderson: '#4a90d9', Nadia: '#e879a0' })[firstName(name)] || 'var(--accent)';
const fmtDT     = dt => dt ? new Date(dt).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

// Para strings ISO da API usa a parte da data diretamente (evita virada de dia UTC→BRT)
// Para Date objects (ex: new Date()) converte para o fuso de Brasília
const localDay  = d => {
  if (!d) return '';
  if (typeof d === 'string') return d.substring(0, 10);
  return new Date(d).toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
};
const fmtDate   = d => d ? new Date(localDay(d) + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
const todayStr    = () => localDay(new Date());
const monthStart  = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }); };

const REPORT_RECIPIENTS = ['andersonpioner@gmail.com', 'vendruscolo.nadia@gmail.com'];

const COLORS = [
  '#00d4aa','#4a90d9','#f5c842','#ef5350','#ab47bc',
  '#ff7043','#26c6da','#66bb6a','#ffa726','#ec407a',
  '#5c6bc0','#d4e157','#ff5722','#8d6e63','#78909c',
];

/* ── TopBar ── */
function TopBar({ dateFrom, dateTo, onFrom, onTo, syncStatus, onSync, onFullSync, syncing, customInterval, onToggleCustomInterval, calYear, calMonth, setCalYear, setCalMonth }) {
  const [preset, setPreset] = useState('month');

  function applyPreset(p) {
    setPreset(p);
    const d = new Date();
    if (p === 'month') {
      if (setCalYear) setCalYear(d.getFullYear());
      if (setCalMonth) setCalMonth(d.getMonth());
      if (onToggleCustomInterval) onToggleCustomInterval(false);
      return;
    }
    const ranges = {
      '3m':  [new Date(d.getFullYear(), d.getMonth() - 2, 1), d],
      '6m':  [new Date(d.getFullYear(), d.getMonth() - 5, 1), d],
      year:  [new Date(d.getFullYear(), 0, 1), d],
    };
    const [f, t] = ranges[p];
    onFrom(f.toISOString().slice(0, 10));
    onTo(t.toISOString().slice(0, 10));
    if (onToggleCustomInterval) onToggleCustomInterval(true);
  }

  const lastSync = syncStatus?.last_sync;
  const oldest   = syncStatus?.counts?.oldest_txn;
  const newest   = syncStatus?.counts?.newest_txn;

  return (
    <div className="topbar">
      <div className="logo">Pluggy Família</div>
      <div className="vsep" />
      <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',userSelect:'none',color:!customInterval?'var(--text)':'var(--muted)'}}>
        <input type="radio" checked={!customInterval} onChange={() => onToggleCustomInterval(false)} />
        Mês:
      </label>
      <input type="month"
        value={calYear && calMonth !== undefined ? `${calYear}-${String(calMonth + 1).padStart(2, '0')}` : ''}
        onChange={e => {
          if (!e.target.value) return;
          const [y, m] = e.target.value.split('-');
          if (setCalYear) setCalYear(parseInt(y, 10));
          if (setCalMonth) setCalMonth(parseInt(m, 10) - 1);
          if (onToggleCustomInterval) onToggleCustomInterval(false);
          setPreset('');
        }}
        disabled={customInterval}
        style={{opacity: customInterval ? 0.5 : 1}}
      />
      <div className="vsep" />
      <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',userSelect:'none',color:customInterval?'var(--text)':'var(--muted)'}}>
        <input type="radio" checked={customInterval} onChange={() => onToggleCustomInterval(true)} />
        Personalizado:
      </label>
      <input type="date" value={dateFrom} onChange={e => { onFrom(e.target.value); setPreset(''); onToggleCustomInterval(true); }} disabled={!customInterval} style={{opacity:customInterval?1:0.5}} />
      <span style={{color:customInterval?'var(--muted)':'var(--border2)'}}>a</span>
      <input type="date" value={dateTo}   onChange={e => { onTo(e.target.value);   setPreset(''); onToggleCustomInterval(true); }} disabled={!customInterval} style={{opacity:customInterval?1:0.5}} />
      <div className="vsep" />
      {[['month','Mês Atual'],['3m','3M'],['6m','6M'],['year','1A']].map(([p, label]) => (
        <button key={p} className={`preset-btn${preset === p ? ' active' : ''}`} onClick={() => applyPreset(p)}>
          {label}
        </button>
      ))}
      <div className="spacer" />
      {lastSync && (
        <div className="sync-info">
          BD: <span>{oldest ? fmtDate(oldest) : '—'}</span> → <span>{newest ? fmtDate(newest) : '—'}</span>
          &nbsp;· Sinc: <span>{fmtDT(lastSync.synced_at)}</span>
        </div>
      )}
<button className="sync-btn full" onClick={onFullSync} disabled={syncing} title="Sincronizar últimos 12 meses">
        Sinc. completa
      </button>
      <button className="sync-btn" onClick={onSync} disabled={syncing}>
        {syncing && <span className="spin" />}
        {syncing ? 'Sincronizando…' : 'Sincronizar'}
      </button>
    </div>
  );
}

/* ── Summary card ── */
function SCard({ label, value, color, isCount, subText, copyText, subCopyText }) {
  const [copied,    setCopied]    = React.useState(false);
  const [subCopied, setSubCopied] = React.useState(false);
  function handleCopy() {
    navigator.clipboard.writeText(copyText).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }
  function handleSubCopy() {
    navigator.clipboard.writeText(subCopyText).then(() => {
      setSubCopied(true);
      setTimeout(() => setSubCopied(false), 2000);
    });
  }
  return (
    <div className="s-card">
      <div className="s-label" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{label}</span>
        {subText && (
          <span style={{display:'flex',alignItems:'center',gap:3,fontSize:10,fontWeight:400,color:'var(--muted)',textTransform:'none',letterSpacing:0}}>
            {subText}
            {subCopyText && (
              <button onClick={handleSubCopy} title="Copiar para WhatsApp"
                style={{background:'none',border:'none',cursor:'pointer',padding:'0 2px',
                        fontSize:12,color:subCopied?'var(--green)':'var(--muted)',lineHeight:1,flexShrink:0}}>
                {subCopied ? '✓' : '⧉'}
              </button>
            )}
          </span>
        )}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div className={`s-value ${color}`}>{isCount ? value : fmt(value)}</div>
        {copyText && (
          <button onClick={handleCopy} title="Copiar para WhatsApp"
            style={{background:'none',border:'none',cursor:'pointer',padding:'2px 4px',
                    fontSize:15,color:copied?'var(--green)':'var(--muted)',lineHeight:1,flexShrink:0}}>
            {copied ? '✓' : '⧉'}
          </button>
        )}
      </div>
    </div>
  );
}


/* ── Account list ── */
function AccountList({ accounts, selected, onSelect, onToggleHidden }) {
  const [showHidden, setShowHidden] = useState(false);

  const visible = accounts.filter(a => !a.hidden);
  const hidden  = accounts.filter(a =>  a.hidden);

  const banks = visible.filter(a => a.type === 'BANK');
  const cards = visible.filter(a => a.type === 'CREDIT');

  function renderAcc(a) {
    const isHidden = !!a.hidden;
    return (
      <div key={a.id}
        className={`acc-item${selected === a.id ? ' sel' : ''}${isHidden ? ' hidden-acc' : ''}`}
        onClick={() => !isHidden && onSelect(selected === a.id ? '' : a.id)}>
        <button className="acc-hidden-btn"
          title={isHidden ? 'Mostrar conta' : 'Ocultar conta'}
          onClick={e => { e.stopPropagation(); onToggleHidden(a.id); }}>
          {isHidden ? '👁' : '🚫'}
        </button>
        <span className={`acc-badge ${a.type}`}>{a.type === 'BANK' ? 'Banco' : 'Crédito'}</span>
        <div className="acc-inst">{a.institution}</div>
        <div className="acc-name" title={a.name}>{a.name}</div>
        {a.owner && <div className="acc-owner" style={{color: ownerColor(a.owner)}}>{firstName(a.owner)}</div>}
        {!isHidden && (
          <div className="acc-balance" style={{ color: a.balance >= 0 ? 'var(--green)' : 'var(--red)' }}>
            {fmt(a.balance)}
          </div>
        )}
      </div>
    );
  }

  if (!accounts.length) return (
    <div style={{ padding:'20px 12px', color:'var(--muted)', fontSize:'11px', fontFamily:'var(--mono)' }}>
      Nenhuma conta no banco de dados.<br/>Clique em "Sincronizar" para carregar.
    </div>
  );

  return (
    <>
      {banks.length > 0 && <><div className="panel-title">Contas Bancárias</div>{banks.map(renderAcc)}</>}
      {cards.length > 0 && <><div className="panel-title">Cartões de Crédito</div>{cards.map(renderAcc)}</>}
      {hidden.length > 0 && (
        <>
          <div className="hidden-toggle" onClick={() => setShowHidden(s => !s)}>
            {showHidden ? '▲' : '▼'} {hidden.length} conta{hidden.length > 1 ? 's' : ''} oculta{hidden.length > 1 ? 's' : ''}
          </div>
          {showHidden && hidden.map(renderAcc)}
        </>
      )}
    </>
  );
}

      type: 'doughnut',

/* ── Transaction table ── */
function TxnTable({ txns, sortField, sortDir, onSort, onSyncClick, tags, onToggleTxnTag, conjuntos, onToggleTxnConjunto }) {
  const [tagPopover,      setTagPopover]      = useState(null);
  const [conjuntoPopover, setConjuntoPopover] = useState(null);

  useEffect(() => {
    if (!tagPopover && !conjuntoPopover) return;
    const close = () => { setTagPopover(null); setConjuntoPopover(null); };
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [tagPopover, conjuntoPopover]);

  const arrow = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  if (!txns.length) return (
    <div className="empty">
      Nenhuma transação para o período selecionado.
      <br />
      <button className="empty-action" onClick={onSyncClick}>Sincronizar agora</button>
    </div>
  );

  return (
    <>
      <table>
      <thead>
        <tr>
          <th className={sortField==='date'?'sorted':''} onClick={() => onSort('date')}>Data{arrow('date')}</th>
          <th className={sortField==='description'?'sorted':''} onClick={() => onSort('description')}>Descrição{arrow('description')}</th>
          <th>Tags</th>
          <th>Conjunto</th>
          <th className={sortField==='category'?'sorted':''} onClick={() => onSort('category')}>Categoria{arrow('category')}</th>
          <th>Dono</th>
          <th>Conta</th>
          <th className={sortField==='amount'?'sorted':''} onClick={() => onSort('amount')} style={{textAlign:'right'}}>Valor{arrow('amount')}</th>
        </tr>
      </thead>
      <tbody>
        {txns.map(t => {
          const txnTagIds = t.tag_ids ? t.tag_ids.split(',').filter(Boolean).map(Number) : [];
          const txnTags   = tags ? tags.filter(tg => txnTagIds.includes(tg.id)) : [];
          const txnConjuntoIds = t.conjunto_ids ? t.conjunto_ids.split(',').filter(Boolean).map(Number) : [];
          const txnConjuntos   = conjuntos ? conjuntos.filter(cj => txnConjuntoIds.includes(cj.id)) : [];
          return (
            <tr key={t.id} className={t.contingencia ? 'cont-txn-row' : ''}>
              <td className="dt">{fmtDate(t.date)}</td>
              <td className="desc" title={t.description}>
                {t.contingencia ? <span className="tag-pill cont-mark" title="Transação de contingência (importação manual)" style={{marginRight:6}}>⚡ contingência</span> : null}
                {t.description || '—'}
              </td>
              <td>
                <div style={{display:'flex', gap:4, flexWrap:'wrap', alignItems:'center'}}>
                  {txnTags.map(tg => (
                    <span key={tg.id} className="tag-pill"
                      style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66', cursor: onToggleTxnTag ? 'pointer' : 'default'}}
                      title={onToggleTxnTag ? `Remover: ${tg.name}` : tg.name}
                      onClick={e => {
                        e.stopPropagation();
                        if(onToggleTxnTag) onToggleTxnTag(t.id, tg.id);
                      }}>
                      {tg.name}
                    </span>
                  ))}
                  {onToggleTxnTag && (
                    <button className="tag-add-btn" title="Editar tags"
                      onClick={e => {
                        e.stopPropagation();
                        if (tagPopover?.txnId === t.id) { setTagPopover(null); return; }
                        const rect = e.currentTarget.getBoundingClientRect();
                        if (window.innerHeight - rect.bottom < 300) {
                          setTagPopover({ txnId: t.id, bottom: window.innerHeight - rect.top + 4, left: rect.left });
                        } else {
                          setTagPopover({ txnId: t.id, top: rect.bottom + 4, left: rect.left });
                        }
                      }}>
                      {tagPopover?.txnId === t.id ? '✕' : '+'}
                    </button>
                  )}
                </div>
              </td>
              <td>
                <div style={{display:'flex', gap:4, flexWrap:'wrap', alignItems:'center'}}>
                  {txnConjuntos.map(cj => (
                    <span key={cj.id} className="tag-pill"
                      style={{background: cj.color+'22', color: cj.color, borderColor: cj.color+'66', cursor: onToggleTxnConjunto ? 'pointer' : 'default'}}
                      title={onToggleTxnConjunto ? `Remover de: ${cj.name}` : cj.name}
                      onClick={e => {
                        e.stopPropagation();
                        if(onToggleTxnConjunto) onToggleTxnConjunto(t.id, cj.id);
                      }}>
                      {cj.name}
                    </span>
                  ))}
                  {onToggleTxnConjunto && (
                    <button className="tag-add-btn" title="Editar conjuntos"
                      onClick={e => {
                        e.stopPropagation();
                        if (conjuntoPopover?.txnId === t.id) { setConjuntoPopover(null); return; }
                        const rect = e.currentTarget.getBoundingClientRect();
                        if (window.innerHeight - rect.bottom < 300) {
                          setConjuntoPopover({ txnId: t.id, bottom: window.innerHeight - rect.top + 4, left: rect.left });
                        } else {
                          setConjuntoPopover({ txnId: t.id, top: rect.bottom + 4, left: rect.left });
                        }
                      }}>
                      {conjuntoPopover?.txnId === t.id ? '✕' : '+'}
                    </button>
                  )}
                </div>
              </td>
              <td className="cat">{t.category || '—'}</td>
              <td className="acc">{firstName(t.owner_name) || '—'}</td>
              <td className="acc" title={t.account_name}>{t.account_name || '—'}</td>
              <td className={`amt ${t.type}`}>
                {t.type === 'DEBIT' ? '−' : '+'}{fmt(Math.abs(t.amount))}
              </td>
            </tr>
          );
        })}
      </tbody>
      </table>
      {tagPopover && (() => {
        const txn       = txns.find(t => t.id === tagPopover.txnId);
        const txnTagIds = txn && txn.tag_ids ? txn.tag_ids.split(',').filter(Boolean).map(Number) : [];
        return (
          <div className="tag-selector"
            style={{
              position: 'fixed', 
              top: tagPopover.top !== undefined ? tagPopover.top : 'auto', 
              bottom: tagPopover.bottom !== undefined ? tagPopover.bottom : 'auto', 
              left: tagPopover.left
            }}
            onClick={e => e.stopPropagation()}>
            <div className="tag-selector-title">Tags</div>
            {tags.map(tg => (
              <label key={tg.id} className="tag-selector-item">
                <input type="checkbox"
                  checked={txnTagIds.includes(tg.id)}
                  onChange={() => { if(onToggleTxnTag) onToggleTxnTag(tagPopover.txnId, tg.id); }} />
                <span className="tag-pill"
                  style={{background: tg.color+'22', color: tg.color, borderColor: tg.color+'66'}}>
                  {tg.name}
                </span>
              </label>
            ))}
          </div>
        );
      })()}
      {conjuntoPopover && (() => {
        const txn            = txns.find(t => t.id === conjuntoPopover.txnId);
        const txnConjuntoIds = txn && txn.conjunto_ids ? txn.conjunto_ids.split(',').filter(Boolean).map(Number) : [];
        return (
          <div className="tag-selector"
            style={{
              position: 'fixed',
              top: conjuntoPopover.top !== undefined ? conjuntoPopover.top : 'auto',
              bottom: conjuntoPopover.bottom !== undefined ? conjuntoPopover.bottom : 'auto',
              left: conjuntoPopover.left
            }}
            onClick={e => e.stopPropagation()}>
            <div className="tag-selector-title">Conjuntos</div>
            {(!conjuntos || !conjuntos.length) && (
              <div style={{fontSize:11, color:'var(--muted)', padding:'4px 2px', maxWidth:180}}>
                Nenhum conjunto criado ainda. Crie um na aba "Conjuntos".
              </div>
            )}
            {conjuntos && conjuntos.map(cj => (
              <label key={cj.id} className="tag-selector-item">
                <input type="checkbox"
                  checked={txnConjuntoIds.includes(cj.id)}
                  onChange={() => { if(onToggleTxnConjunto) onToggleTxnConjunto(conjuntoPopover.txnId, cj.id); }} />
                <span className="tag-pill"
                  style={{background: cj.color+'22', color: cj.color, borderColor: cj.color+'66'}}>
                  {cj.name}
                </span>
              </label>
            ))}
          </div>
        );
      })()}
    </>
  );
}

/* ── Calendar bar chart ── */
function CalBarChart({ dayMap, calYear, calMonth, daysInMonth }) {
  const ref   = useRef(null);
  const chart = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();

    const mm     = String(calMonth + 1).padStart(2, '0');
    const labels = Array.from({ length: daysInMonth }, (_, i) => i + 1);
    const income  = labels.map(d => dayMap[`${calYear}-${mm}-${String(d).padStart(2,'0')}`]?.income  || 0);
    const expense = labels.map(d => dayMap[`${calYear}-${mm}-${String(d).padStart(2,'0')}`]?.expense || 0);

    chart.current = new Chart(ref.current, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Entradas', data: income,  backgroundColor: 'rgba(0,212,170,0.55)', borderRadius: 3 },
          { label: 'Saídas',   data: expense, backgroundColor: 'rgba(239,83,80,0.55)',  borderRadius: 3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            labels: { color: '#8899aa', font: { size: 11 }, boxWidth: 12, padding: 10 },
          },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`,
            },
          },
        },
        scales: {
          x: {
            ticks: { color: '#8899aa', font: { size: 10 } },
            grid:  { color: 'rgba(255,255,255,0.04)' },
          },
          y: {
            type: 'logarithmic',
            ticks: {
              color: '#8899aa', font: { size: 10 },
              callback: v => v === 0 ? '0' : (v >= 1000 ? `${(v/1000).toFixed(0)}k` : v),
            },
            grid: { color: 'rgba(255,255,255,0.06)' },
          },
        },
      },
    });
    return () => chart.current?.destroy();
  }, [dayMap, calYear, calMonth, daysInMonth]);

  return <div style={{ height: '180px', padding: '10px 16px 4px' }}><canvas ref={ref} /></div>;
}

/* ── Month color wheel (shared between chips and both charts) ── */
const monthColor = i => `hsl(${Math.round(i * 360 / 12)}, 70%, 60%)`;

/* ── Monthly evolution chart: one line per month, x = day of month ── */
function MonthlyEvolutionChart({ dataByMonth, dayLabels, monthsAbbr, hiddenMonths }) {
  const ref   = useRef(null);
  const chart = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();

    const datasets = monthsAbbr.map((label, i) => ({
      label,
      data: dataByMonth[i],
      borderColor: monthColor(i),
      backgroundColor: monthColor(i),
      borderWidth: 1.75,
      tension: 0.25,
      pointRadius: 0,
      pointHoverRadius: 3,
      spanGaps: false,
      hidden: hiddenMonths.has(i),
    }));

    chart.current = new Chart(ref.current, {
      type: 'line',
      data: { labels: dayLabels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        // Animação desligada: o slider de meses/dias recria o gráfico a cada
        // pixel arrastado, e a animação de "crescer do zero" a cada recriação
        // é o que causava o tremor visual durante o arraste.
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            itemSort: (a, b) => a.datasetIndex - b.datasetIndex,
            callbacks: {
              title: items => `Dia ${items[0].label}`,
              label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`,
            },
          },
        },
        scales: {
          x: {
            ticks: { color: '#8899aa', font: { size: 10 } },
            grid:  { color: 'rgba(255,255,255,0.04)' },
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#8899aa', font: { size: 10 },
              callback: v => v >= 1000 ? `${(v/1000).toFixed(1)}k` : v,
            },
            grid: { color: 'rgba(255,255,255,0.06)' },
          },
        },
      },
    });
    return () => chart.current?.destroy();
  }, [dataByMonth, dayLabels, monthsAbbr, hiddenMonths]);

  return <div style={{ height: '280px', padding: '10px 16px' }}><canvas ref={ref} /></div>;
}

/* ── Generic dual-handle drag track, shared by the month and day range sliders ── */
function DualRangeTrack({ range, onChange, steps }) {
  const [start, end] = range;
  const trackRef = useRef(null);
  const dragRef  = useRef(null); // 'start' | 'end' | null

  function valueFromClientX(clientX) {
    const rect  = trackRef.current.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return Math.round(ratio * steps);
  }

  function beginDrag(which, e) {
    e.stopPropagation();
    e.preventDefault();
    dragRef.current = which;

    function move(ev) {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const v = valueFromClientX(clientX);
      if (dragRef.current === 'start') onChange([Math.min(v, end), end]);
      else                             onChange([start, Math.max(v, start)]);
    }
    function up() {
      dragRef.current = null;
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', up);
  }

  function onTrackClick(e) {
    const v = valueFromClientX(e.clientX);
    if (Math.abs(v - start) <= Math.abs(v - end)) onChange([Math.min(v, end), end]);
    else                                           onChange([start, Math.max(v, start)]);
  }

  const pctStart = (start / steps) * 100;
  const pctEnd   = (end   / steps) * 100;

  return (
    <div className="mc-range-track-wrap" ref={trackRef} onClick={onTrackClick}>
      <div className="mc-range-track" />
      <div className="mc-range-fill" style={{ left: `${pctStart}%`, right: `${100 - pctEnd}%` }} />
      <div className="mc-range-handle" style={{ left: `${pctStart}%` }}
        onMouseDown={e => beginDrag('start', e)} onTouchStart={e => beginDrag('start', e)} />
      <div className="mc-range-handle" style={{ left: `${pctEnd}%` }}
        onMouseDown={e => beginDrag('end', e)} onTouchStart={e => beginDrag('end', e)} />
    </div>
  );
}

/* ── Month range slider: dual-handle drag to pick a contiguous Jan…Dez range ── */
function MonthRangeSlider({ range, onChange, monthsAbbr }) {
  const [start, end] = range;
  const steps = monthsAbbr.length - 1; // 11

  return (
    <div className="mc-range">
      <DualRangeTrack range={range} onChange={onChange} steps={steps} />
      <div className="mc-range-labels">
        {monthsAbbr.map((m, i) => (
          <span key={i} className={i >= start && i <= end ? 'active' : ''}
            style={{ left: `${(i / steps) * 100}%` }}>{m}</span>
        ))}
      </div>
    </div>
  );
}

/* ── Day range slider: dual-handle drag to pick which days of the month (1-31) show on the x-axis ── */
function DayRangeSlider({ range, onChange, totalDays }) {
  const [start, end] = range;
  const steps = totalDays - 1;
  const ticks = [1, 5, 10, 15, 20, 25, totalDays].filter((d, idx, arr) => arr.indexOf(d) === idx);

  return (
    <div className="mc-range">
      <div className="mc-day-range-readout">Dia {start + 1} até Dia {end + 1}</div>
      <DualRangeTrack range={range} onChange={onChange} steps={steps} />
      <div className="mc-range-labels">
        {ticks.map(d => (
          <span key={d} className={(d - 1) >= start && (d - 1) <= end ? 'active' : ''}
            style={{ left: `${((d - 1) / steps) * 100}%` }}>{d}</span>
        ))}
      </div>
    </div>
  );
}

/* ── Monthly charts view: evolução diária de despesas/receitas, uma linha por mês ── */
function MonthlyChartsView({ allAccounts, hideRendeFacil, calYear, setCalYear }) {
  const [txns,    setTxns]    = useState([]);
  const [loading, setLoading] = useState(false);
  const [hiddenMonths, setHiddenMonths] = useState(() => new Set());
  const [monthRange, setMonthRange]     = useState([0, 11]);
  const [dayRange,   setDayRange]       = useState([0, 30]);

  const MONTHS_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  useEffect(() => {
    async function load() {
      setLoading(true);
      try {
        const r = await fetch(`/api/transactions?from=${calYear}-01-01&to=${calYear}-12-31`);
        const d = await r.json();
        setTxns(d.results || []);
      } catch {} finally { setLoading(false); }
    }
    load();
  }, [calYear]);

  const visibleIds = useMemo(() => new Set(allAccounts.map(a => a.id)), [allAccounts]);

  // Mesma filtragem da visualização Calendário: contas visíveis + filtro de rendimento fácil
  const filtered = useMemo(() => {
    const base = txns.filter(t => visibleIds.has(t.account_id));
    if (!hideRendeFacil) return base;
    return base.filter(t => {
      const d = (t.description || '').toUpperCase();
      return !(d.includes('REND') && d.includes('FACIL'));
    });
  }, [txns, visibleIds, hideRendeFacil]);

  // Mesma dedupe + exclusão de ignoradas usada no dayMap do Calendário, acumulada dia a dia por mês
  const { expenseByMonth, incomeByMonth } = useMemo(() => {
    const expDaily = Array.from({ length: 12 }, () => Array(31).fill(0));
    const incDaily = Array.from({ length: 12 }, () => Array(31).fill(0));
    const seen = new Set();
    filtered.forEach(t => {
      const k      = localDay(t.date);
      const amt    = Math.abs(parseFloat(t.amount) || 0);
      const dupKey = `${k}|${amt.toFixed(2)}|${t.description}|${t.account_name}|${t.type}`;
      if (seen.has(dupKey)) return;
      seen.add(dupKey);
      if (t.ignored) return;
      const month = parseInt(k.slice(5, 7), 10) - 1;
      const day   = parseInt(k.slice(8, 10), 10) - 1;
      if (month < 0 || month > 11 || day < 0 || day > 30) return;
      if (t.type === 'CREDIT') incDaily[month][day] += amt;
      else expDaily[month][day] += amt;
    });

    const expenseByMonth = Array.from({ length: 12 }, () => Array(31).fill(null));
    const incomeByMonth  = Array.from({ length: 12 }, () => Array(31).fill(null));
    for (let m = 0; m < 12; m++) {
      const daysInThisMonth = new Date(calYear, m + 1, 0).getDate();
      let cumExp = 0, cumInc = 0;
      for (let d = 0; d < daysInThisMonth; d++) {
        cumExp += expDaily[m][d]; expenseByMonth[m][d] = cumExp;
        cumInc += incDaily[m][d]; incomeByMonth[m][d]  = cumInc;
      }
      // Para meses com menos de 31 dias (ex: 30 dias ou Fev com 28/29), replica o total até o dia 31
      for (let d = daysInThisMonth; d < 31; d++) {
        expenseByMonth[m][d] = cumExp;
        incomeByMonth[m][d]  = cumInc;
      }
    }
    return { expenseByMonth, incomeByMonth };
  }, [filtered, calYear]);

  // Recorte do eixo de dias (1-31) selecionado no slider de dias
  const dayLabels = useMemo(() => {
    const [s, e] = dayRange;
    return Array.from({ length: e - s + 1 }, (_, i) => s + i + 1);
  }, [dayRange]);

  const slicedExpenseByMonth = useMemo(() =>
    expenseByMonth.map(arr => arr.slice(dayRange[0], dayRange[1] + 1)),
  [expenseByMonth, dayRange]);

  const slicedIncomeByMonth = useMemo(() =>
    incomeByMonth.map(arr => arr.slice(dayRange[0], dayRange[1] + 1)),
  [incomeByMonth, dayRange]);

  function toggleMonth(i) {
    setHiddenMonths(prev => {
      const next = new Set(prev);
      next.has(i) ? next.delete(i) : next.add(i);
      return next;
    });
  }

  function handleRangeChange(newRange) {
    setMonthRange(newRange);
    const [s, e] = newRange;
    const next = new Set();
    for (let i = 0; i < 12; i++) if (i < s || i > e) next.add(i);
    setHiddenMonths(next);
  }

  return (
    <div className="cal-container">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button className="cal-nav-btn" onClick={() => setCalYear(y => y - 1)}>‹</button>
          <span className="cal-month-label">{calYear}</span>
          <button className="cal-nav-btn" onClick={() => setCalYear(y => y + 1)}>›</button>
        </div>
        {loading && <span className="spin" />}
      </div>
      <div className="cal-body">
        <div className="mc-months">
          {MONTHS_ABBR.map((m, i) => {
            const off = hiddenMonths.has(i);
            return (
              <button key={i} className={`mc-month-chip${off ? ' off' : ''}`}
                style={off ? {} : { borderColor: monthColor(i), color: monthColor(i) }}
                onClick={() => toggleMonth(i)}>
                {m}
              </button>
            );
          })}
        </div>
        <MonthRangeSlider range={monthRange} onChange={handleRangeChange} monthsAbbr={MONTHS_ABBR} />
        <DayRangeSlider range={dayRange} onChange={setDayRange} totalDays={31} />
        <div className="cal-chart-wrap">
          <div className="cal-chart-title">Evolução das despesas (acumulado no mês, por dia)</div>
          <MonthlyEvolutionChart dataByMonth={slicedExpenseByMonth} dayLabels={dayLabels} monthsAbbr={MONTHS_ABBR} hiddenMonths={hiddenMonths} />
        </div>
        <div className="cal-chart-wrap">
          <div className="cal-chart-title">Evolução das receitas (acumulado no mês, por dia)</div>
          <MonthlyEvolutionChart dataByMonth={slicedIncomeByMonth} dayLabels={dayLabels} monthsAbbr={MONTHS_ABBR} hiddenMonths={hiddenMonths} />
        </div>
      </div>
    </div>
  );
}

const ROW_BAR_THICKNESS      = 16;  // px — igual em todos os gráficos, não importa quantos itens
const ROW_SLOT_HEIGHT        = 32;  // px de "trilha" reservados por item (barra + espaçamento) — sempre > ROW_BAR_THICKNESS
const ORIGIN_X_AXIS_HEIGHT   = 26;  // px do eixo X, forçado via afterFit para ser sempre igual
// O Chart.js reserva, além do eixo X, uma margem fixa (~9px, empírica) antes
// do início da trilha de categorias — sem contar essa margem no orçamento de
// altura, ela "roubava" espaço da trilha, e como é fixa (não escala com o nº
// de itens), o gráfico com só 1 item sobrava com uma trilha bem menor que
// ROW_SLOT_HEIGHT e a barra saía cortada/mais fina que a dos gráficos com
// mais itens.
const ORIGIN_TOP_PAD         = 12;
const ORIGIN_CHART_RESERVE   = ORIGIN_X_AXIS_HEIGHT + ORIGIN_TOP_PAD;
const ORIGIN_LABEL_COL_WIDTH = 180; // px — largura fixa da coluna de rótulos (conta/cartão), igual em todos os gráficos
const ORIGIN_LABEL_MAX_CHARS = 28;  // trunca rótulos maiores que isso para caber na coluna acima

/* ── Horizontal bar chart: despesas de um dono, agrupadas por conta/cartão ── */
function OriginBarChart({ items, maxScale }) {
  const ref   = useRef(null);
  const chart = useRef(null);

  useEffect(() => {
    if (!ref.current || !items.length) return;
    if (chart.current) chart.current.destroy();

    const sorted = [...items].sort((a, b) => b.amount - a.amount);
    const labels = sorted.map(g => g.name);
    const data   = sorted.map(g => g.amount);
    const colors = sorted.map(g => g.isCard ? 'rgba(239,83,80,0.75)' : 'rgba(74,144,217,0.75)');

    chart.current = new Chart(ref.current, {
      type: 'bar',
      data: {
        labels,
        // barThickness fixo (em px): evita que a barra fique mais fina/grossa
        // dependendo de quantos itens (contas/cartões) o gráfico tem.
        datasets: [{ data, backgroundColor: colors, borderRadius: 3, barThickness: ROW_BAR_THICKNESS }],
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } },
        },
        scales: {
          x: {
            // min/max fixos (em vez do auto-scale padrão do Chart.js): sem
            // isso cada gráfico escala pelo próprio maior valor, então a
            // mesma largura de barra representaria valores diferentes em
            // cada gráfico. maxScale vem do maior item entre todos os donos.
            min: 0,
            max: maxScale,
            // afterFit força a mesma altura de eixo X em todos os gráficos.
            // Sem isso, o Chart.js reserva uma altura de eixo ligeiramente
            // diferente conforme o layout, e como o "slot" de cada categoria
            // é (altura do canvas − altura do eixo) ÷ nº de itens, um gráfico
            // com 1 item sobra menos espaço por categoria que um com 2+ —
            // isso comprimia/cortava a barra do gráfico de 1 item, deixando-a
            // mais fina que a dos gráficos com mais itens.
            afterFit: scale => { scale.height = ORIGIN_X_AXIS_HEIGHT; },
            ticks: {
              color: '#8899aa', font: { size: 10 },
              callback: v => v >= 1000 ? `${(v/1000).toFixed(1)}k` : v,
            },
            grid: { color: 'rgba(255,255,255,0.05)' },
          },
          y: {
            // afterFit força a mesma largura de coluna de rótulo em todos os
            // gráficos — sem isso, cada instância do Chart.js dimensiona a
            // coluna pelo rótulo mais longo DELA, então a barra começa em um
            // x diferente em cada gráfico (ex: "BANCO DO BRASIL S/A" reserva
            // menos espaço que "OUROCARD INFINITE VISA ESTILO").
            afterFit: scale => { scale.width = ORIGIN_LABEL_COL_WIDTH; },
            ticks: {
              color: '#c8d8e8', font: { size: 10 },
              // autoSkip desligado: por padrão o Chart.js descarta rótulos que
              // "não cabem" no espaço calculado, fazendo nomes de conta/cartão
              // sumirem quando o gráfico tem poucos itens (pouca altura).
              autoSkip: false,
              callback: function (value) {
                const label = this.getLabelForValue(value);
                return label.length > ORIGIN_LABEL_MAX_CHARS
                  ? label.slice(0, ORIGIN_LABEL_MAX_CHARS - 1) + '…'
                  : label;
              },
            },
            grid: { display: false },
          },
        },
      },
    });
    return () => chart.current?.destroy();
  }, [items, maxScale]);

  if (!items.length) return null;
  const height = items.length * ROW_SLOT_HEIGHT + ORIGIN_CHART_RESERVE;
  return <div style={{ position: 'relative', height, padding: '4px 16px 10px' }}><canvas ref={ref} /></div>;
}

/* ── Origem dos gastos: despesas do mês separadas por dono, conta e cartão ── */
function OriginView({ allAccounts, hideRendeFacil, calYear, calMonth, setCalYear, setCalMonth }) {
  const [txns,    setTxns]    = useState([]);
  const [loading, setLoading] = useState(false);

  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  useEffect(() => {
    async function load() {
      setLoading(true);
      const mm   = String(calMonth + 1).padStart(2, '0');
      const last = new Date(calYear, calMonth + 1, 0).getDate();
      try {
        const r = await fetch(`/api/transactions?from=${calYear}-${mm}-01&to=${calYear}-${mm}-${last}`);
        const d = await r.json();
        setTxns(d.results || []);
      } catch {} finally { setLoading(false); }
    }
    load();
  }, [calYear, calMonth]);

  const visibleIds = useMemo(() => new Set(allAccounts.map(a => a.id)), [allAccounts]);

  // Mesma filtragem da visualização Calendário: contas visíveis + filtro de rendimento fácil
  const filtered = useMemo(() => {
    const base = txns.filter(t => visibleIds.has(t.account_id));
    if (!hideRendeFacil) return base;
    return base.filter(t => {
      const d = (t.description || '').toUpperCase();
      return !(d.includes('REND') && d.includes('FACIL'));
    });
  }, [txns, visibleIds, hideRendeFacil]);

  // Mesma dedupe + exclusão de ignoradas do dayMap do Calendário, agregada por dono/conta/cartão
  const owners = useMemo(() => {
    const seen = new Set();
    const map  = {};
    filtered.forEach(t => {
      if (t.type === 'CREDIT') return; // só despesas
      const k      = localDay(t.date);
      const amt    = Math.abs(parseFloat(t.amount) || 0);
      const dupKey = `${k}|${amt.toFixed(2)}|${t.description}|${t.account_name}|${t.type}`;
      if (seen.has(dupKey)) return;
      seen.add(dupKey);
      if (t.ignored) return;

      const owner   = firstName(t.owner_name) || 'Sem dono';
      const accName = t.account_name || 'Sem conta';
      const isCard  = t.account_type === 'CREDIT';
      if (!map[owner]) map[owner] = { total: 0, accounts: {} };
      map[owner].total += amt;
      const key = `${accName}__${isCard ? 'card' : 'bank'}`;
      if (!map[owner].accounts[key]) map[owner].accounts[key] = { name: accName, isCard, amount: 0 };
      map[owner].accounts[key].amount += amt;
    });
    return Object.entries(map)
      .map(([name, v]) => ({
        name,
        total:    v.total,
        accounts: Object.values(v.accounts).filter(a => !a.isCard),
        cards:    Object.values(v.accounts).filter(a =>  a.isCard),
      }))
      .sort((a, b) => b.total - a.total);
  }, [filtered]);

  const grandTotal = owners.reduce((s, o) => s + o.total, 0);

  // Maior valor entre todas as contas/cartões de todos os donos, para que
  // todos os gráficos de barra da view usem a mesma escala no eixo X.
  const maxItemAmount = useMemo(() => {
    let max = 0;
    owners.forEach(o => {
      [...o.accounts, ...o.cards].forEach(a => { if (a.amount > max) max = a.amount; });
    });
    return max;
  }, [owners]);

  function prevMonth() {
    if (calMonth === 0) { setCalYear(y => y - 1); setCalMonth(11); }
    else setCalMonth(m => m - 1);
  }
  function nextMonth() {
    if (calMonth === 11) { setCalYear(y => y + 1); setCalMonth(0); }
    else setCalMonth(m => m + 1);
  }

  return (
    <div className="cal-container">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button className="cal-nav-btn" onClick={prevMonth}>‹</button>
          <span className="cal-month-label" style={{textTransform:'capitalize'}}>{MONTHS[calMonth]} de {calYear}</span>
          <button className="cal-nav-btn" onClick={nextMonth}>›</button>
        </div>
        {loading && <span className="spin" />}
      </div>
      <div className="cal-body">
        {!loading && !owners.length && <div className="cal-no-txn">Nenhuma despesa neste mês.</div>}
        {owners.map(o => (
          <div key={o.name} className="cal-chart-wrap">
            <div className="origin-owner-hdr">
              <span className="origin-owner-name" style={{color: ownerColor(o.name)}}>{o.name}</span>
              <span className="origin-owner-total">
                {fmt(o.total)}{' '}
                <span className="pct">({grandTotal ? ((o.total / grandTotal) * 100).toFixed(1) : '0'}%)</span>
              </span>
            </div>
            {o.accounts.length > 0 && (
              <>
                <div className="origin-subtitle">Contas</div>
                <OriginBarChart items={o.accounts} maxScale={maxItemAmount} />
              </>
            )}
            {o.cards.length > 0 && (
              <>
                <div className="origin-subtitle">Cartões</div>
                <OriginBarChart items={o.cards} maxScale={maxItemAmount} />
              </>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Account multi-select ── */
function AccountMultiSelect({ accounts, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const label = selected.length === 0
    ? 'Todas as contas'
    : selected.length === 1
      ? (accounts.find(a => a.id === selected[0])?.name ?? '1 conta')
      : `${selected.length} contas selecionadas`;

  function toggle(id) {
    onChange(selected.includes(id) ? selected.filter(x => x !== id) : [...selected, id]);
  }

  return (
    <div className="msel" ref={ref}>
      <button className={`msel-btn${open ? ' open' : ''}`} onClick={() => setOpen(o => !o)}>
        {label} ▾
      </button>
      {open && (
        <div className="msel-drop">
          <div className="msel-item msel-all" onClick={() => { onChange([]); setOpen(false); }}>
            <input type="checkbox" checked={selected.length === 0} readOnly />
            Todas as contas
          </div>
          {accounts.map(a => (
            <div key={a.id} className="msel-item" onClick={() => toggle(a.id)}>
              <input type="checkbox" checked={selected.includes(a.id)} readOnly />
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</span>
              <span style={{color:'var(--muted)',fontSize:'9px'}}>{a.institution}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Report preview modal ── */
function ReportPreviewModal({ html, allRecipients, onSend, onClose, sending, sentMsg }) {
  const [checked, setChecked] = useState(new Set(allRecipients));

  function toggle(email) {
    setChecked(prev => {
      const next = new Set(prev);
      next.has(email) ? next.delete(email) : next.add(email);
      return next;
    });
  }

  const selected = allRecipients.filter(e => checked.has(e));
  const sent     = sentMsg?.type === 'success';

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-hdr">
          <span className="modal-title">Pré-visualização do relatório</span>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <iframe srcDoc={html} title="Relatório" sandbox="allow-same-origin" />
        </div>
        <div className="modal-ftr">
          {sentMsg
            ? <span className="modal-info" style={{color: sent ? 'var(--green)' : 'var(--red)'}}>
                {sent ? '✓ ' : '⚠ '}{sentMsg.text}
              </span>
            : <span className="modal-info" style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
                <span style={{color:'var(--muted)',fontSize:'10px',fontFamily:'var(--mono)'}}>Enviar para:</span>
                {allRecipients.map(email => (
                  <label key={email} className="cal-check-label" style={{fontSize:'11px'}}>
                    <input type="checkbox" checked={checked.has(email)} onChange={() => toggle(email)} />
                    {email}
                  </label>
                ))}
              </span>
          }
          <button className="cal-sort-btn" onClick={onClose}>{sent ? 'Fechar' : 'Cancelar'}</button>
          {!sent && (
            <button className="sync-btn" onClick={() => onSend(selected)}
              disabled={sending || selected.length === 0}>
              {sending ? <><span className="spin"/>Enviando…</> : '✉ Enviar relatório'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

      setReportMsg({ type: 'error', text: `Erro ao gerar preview: ${e.message}` });
    } finally {
      setLoadingPreview(false);
    }
  }

  async function sendReport(selectedRecipients) {
    if (!_reportPayload.current) return;
    setSendingReport(true);
    try {
      const r = await fetch('/api/send-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ..._reportPayload.current, recipients: selectedRecipients }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setReportMsg({ type: 'success', text: `Enviado para: ${(d.recipients || selectedRecipients).join(', ')}` });
    } catch (e) {
      setReportMsg({ type: 'error', text: `Erro ao enviar: ${e.message}` });
    } finally {
      setSendingReport(false);
    }
  }

  function closePreview() {
    setPreviewOpen(false);
    setPreviewHtml(null);
    setReportMsg(null);
  }

  async function toggleIgnored(txnId) {
    const r = await fetch(`/api/transactions/${txnId}/ignored`, { method: 'POST' });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, ignored: d.ignored ? 1 : 0 } : t));
    if (onTransactionUpdate) onTransactionUpdate(txnId, { ignored: d.ignored ? 1 : 0 });
  }

  async function toggleFixed(txnId) {
    const r = await fetch(`/api/transactions/${txnId}/fixed`, { method: 'POST' });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, is_fixed: d.is_fixed ? 1 : 0 } : t));
    if (onTransactionUpdate) onTransactionUpdate(txnId, { is_fixed: d.is_fixed ? 1 : 0 });
  }

  async function desvalidarContingencia(txnId) {
    if (!confirm('Desvalidar esta transação de contingência? Ela sai dos cálculos e volta para a fila de validação.')) return;
    await fetch(`/api/contingencia/${txnId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ validada: 0 }),
    });
    setTxns(prev => prev.filter(t => t.id !== txnId));
    if (onConjuntosChange) onConjuntosChange();
    if (onContingenciaChange) onContingenciaChange();
  }

  const [tagPopover,      setTagPopover]      = useState(null); // { txnId, top, left } | null
  const [conjuntoPopover, setConjuntoPopover] = useState(null); // { txnId, top, left } | null
  useEffect(() => {
    if (!tagPopover && !conjuntoPopover) return;
    const close = () => { setTagPopover(null); setConjuntoPopover(null); };
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [tagPopover, conjuntoPopover]);

  function parseTxnTagIds(t) {
    return (t.tag_ids || '').split(',').filter(Boolean).map(Number);
  }

  async function toggleTxnTag(txnId, tagId) {
    const txn     = txns.find(t => t.id === txnId);
    const current = parseTxnTagIds(txn);
    const next    = current.includes(tagId) ? current.filter(x => x !== tagId) : [...current, tagId];
    const r = await fetch(`/api/transactions/${txnId}/tags`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tag_ids: next }),
    });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, tag_ids: d.tag_ids } : t));
  }

  function parseTxnConjuntoIds(t) {
    return (t.conjunto_ids || '').split(',').filter(Boolean).map(Number);
  }

  async function toggleTxnConjunto(txnId, conjuntoId) {
    const txn     = txns.find(t => t.id === txnId);
    const current = parseTxnConjuntoIds(txn);
    const next    = current.includes(conjuntoId) ? current.filter(x => x !== conjuntoId) : [...current, conjuntoId];
    const r = await fetch(`/api/transactions/${txnId}/conjuntos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conjunto_ids: next }),
    });
    const d = await r.json();
    setTxns(prev => prev.map(t => t.id === txnId ? { ...t, conjunto_ids: d.conjunto_ids } : t));
    if (onConjuntosChange) onConjuntosChange(); // totais/contagens dos conjuntos podem ter mudado
  }

  // Conjuntos que já têm ao menos 1 transação neste mês (não só no dia selecionado) —
  // é essa lista restrita que aparece no seletor, para não poluir com conjuntos
  // de outros meses/assuntos.
  const monthConjuntoIds = useMemo(() => {
    const ids = new Set();
    txns.forEach(t => parseTxnConjuntoIds(t).forEach(id => ids.add(id)));
    return ids;
  }, [txns]);
  const monthConjuntos = useMemo(() =>
    conjuntos.filter(cj => monthConjuntoIds.has(cj.id)),
  [conjuntos, monthConjuntoIds]);

async function loadMonth() {
    setLoading(true);
    const mm   = String(calMonth + 1).padStart(2, '0');
    const last = new Date(calYear, calMonth + 1, 0).getDate();
    try {
      const r = await fetch(`/api/transactions?from=${calYear}-${mm}-01&to=${calYear}-${mm}-${last}`);
      const d = await r.json();
      setTxns(d.results || []);
    } catch {}
    setLoading(false);
  }

  const visibleIds = useMemo(() => new Set(allAccounts.map(a => a.id)), [allAccounts]);

  const calDuplicateIds = useMemo(() => {
    const ids  = new Set();
    const seen = new Set();
    const cands = txns.filter(t => !t.ignored);
    for (let i = 0; i < cands.length; i++) {
      for (let j = i + 1; j < cands.length; j++) {
        const a = cands[i], b = cands[j];
        if (a.type !== b.type) continue;
        if (a.account_name !== b.account_name) continue;
        if (Math.round(Math.abs(parseFloat(a.amount)) * 100) !== Math.round(Math.abs(parseFloat(b.amount)) * 100)) continue;
        const diffDays = Math.abs((new Date(a.date.slice(0,10)) - new Date(b.date.slice(0,10))) / 86400000);
        if (diffDays <= 2) {
          const key = [a.id, b.id].sort().join('|');
          if (!seen.has(key)) { seen.add(key); ids.add(a.id); ids.add(b.id); }
        }
      }
    }
    return ids;
  }, [txns]);

  const filtered = useMemo(() => {
    const base = txns.filter(t => visibleIds.has(t.account_id));
    const byAcc = selAccIds.length ? base.filter(t => selAccIds.includes(t.account_id)) : base;
    if (!hideRendeFacil) return byAcc;
    return byAcc.filter(t => {
      const d = (t.description || '').toUpperCase();
      return !(d.includes('REND') && d.includes('FACIL'));
    });
  }, [txns, selAccIds, visibleIds, hideRendeFacil]);

  const dayMap = useMemo(() => {
    const map  = {};
    const seen = new Set();
    filtered.forEach(t => {
      const k      = localDay(t.date);
      const amt    = Math.abs(parseFloat(t.amount) || 0);
      const dupKey = `${k}|${amt.toFixed(2)}|${t.description}|${t.account_name}|${t.type}`;
      if (seen.has(dupKey)) return;
      seen.add(dupKey);
      if (!map[k]) map[k] = { income: 0, expense: 0, fixedExp: 0, discExp: 0, txns: [] };
      if (!t.ignored) {
        if (t.type === 'CREDIT') {
          map[k].income += amt;
        } else {
          map[k].expense += amt;
          if (t.is_fixed) map[k].fixedExp += amt;
          else            map[k].discExp  += amt;
        }
      }
      map[k].txns.push(t);
    });
    return map;
  }, [filtered]);

  function prevMonth() {
    if (calMonth === 0) { setCalYear(y => y - 1); setCalMonth(11); }
    else setCalMonth(m => m - 1);
  }
  function nextMonth() {
    if (calMonth === 11) { setCalYear(y => y + 1); setCalMonth(0); }
    else setCalMonth(m => m + 1);
  }

  const mm          = String(calMonth + 1).padStart(2, '0');
  const firstDow    = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayKey    = localDay(today);
  const selData     = selDay ? dayMap[selDay] : null;

  return (
    <div className="cal-container">
      <div className="cal-toolbar">
        <AccountMultiSelect accounts={allAccounts} selected={selAccIds} onChange={setSelAccIds} />
        <label className="cal-check-label">
          <input type="checkbox" checked={hideRendeFacil} onChange={e => toggleRendeFacil(e.target.checked)} />
          Ocultar Rende Fácil
        </label>
        <div className="spacer" />
        <div className="cal-nav">
          <button className="cal-nav-btn" onClick={prevMonth}>‹</button>
          <span className="cal-month-label">{MONTHS[calMonth]} {calYear}</span>
          <button className="cal-nav-btn" onClick={nextMonth}>›</button>
        </div>
        {loading && <span className="spin" style={{marginRight:0}} />}
      </div>

      <div className="cal-body">
        <div className="cal-chart-wrap">
          <CalBarChart dayMap={dayMap} calYear={calYear} calMonth={calMonth} daysInMonth={daysInMonth} />
        </div>
        <div className="cal-chart-wrap">
          <div className="cal-chart-title">Evolução de gastos acumulados</div>
          <CalCumChart dayMap={dayMap} calYear={calYear} calMonth={calMonth} daysInMonth={daysInMonth} />
        </div>
        <div className="cal-grid-wrap">
          <div className="cal-grid">
            {DOWS.map(d => <div key={d} className="cal-dow">{d}</div>)}
            {Array.from({length: firstDow}, (_, i) => <div key={`p${i}`} className="cal-cell pad" />)}
            {Array.from({length: daysInMonth}, (_, i) => {
              const day = i + 1;
              const key = `${calYear}-${mm}-${String(day).padStart(2,'0')}`;
              const data = dayMap[key];
              return (
                <div key={key}
                  className={`cal-cell${key===todayKey?' today':''}${selDay===key?' sel':''}` }
                  onClick={() => setSelDay(selDay === key ? null : key)}>
                  <div className="cal-day-n">{day}</div>
                  {data?.income   > 0 && <div className="cal-inc">+{fmt(data.income)}</div>}
                  {data?.discExp  > 0 && <div className="cal-exp">−{fmt(data.discExp)}</div>}
                  {data?.fixedExp > 0 && <div className="cal-exp-fixed">⬡{fmt(data.fixedExp)}</div>}
                </div>
              );
            })}
          </div>
        </div>

        {previewOpen && previewHtml && (
          <ReportPreviewModal
            html={previewHtml}
            allRecipients={REPORT_RECIPIENTS}
            sending={sendingReport}
            sentMsg={reportMsg}
            onSend={sendReport}
            onClose={closePreview}
          />
        )}

        {selDay && (
          <div className="cal-detail" ref={detailRef}>
            <div className="cal-detail-hdr">
              <span className="cal-detail-date">
                {new Date(selDay + 'T12:00:00').toLocaleDateString('pt-BR', {weekday:'long',day:'numeric',month:'long',year:'numeric'})}
              </span>
              <div className="cal-sort-btns">
                <button className={`cal-sort-btn${calSort==='amount'?' active':''}`} onClick={() => setCalSort('amount')}>Por valor</button>
                <button className={`cal-sort-btn${calSort==='owner'?' active':''}`}  onClick={() => setCalSort('owner')}>Por dono</button>
                <button className="cal-sort-btn" onClick={openReportPreview} disabled={loadingPreview}
                  style={{background:'rgba(0,212,170,0.1)',borderColor:'var(--accent)',color:'var(--accent)',marginLeft:4}}>
                  {loadingPreview ? <><span className="spin"/>Carregando…</> : '✉ Relatório'}
                </button>
              </div>
              {selData && (() => {
                const inc      = selData.txns.reduce((s,t) => !t.ignored && t.type==='CREDIT'  ? s + Math.abs(parseFloat(t.amount)||0) : s, 0);
                const discExp  = selData.txns.reduce((s,t) => !t.ignored && t.type!=='CREDIT' && !t.is_fixed ? s + Math.abs(parseFloat(t.amount)||0) : s, 0);
                const fixedExp = selData.txns.reduce((s,t) => !t.ignored && t.type!=='CREDIT' &&  t.is_fixed ? s + Math.abs(parseFloat(t.amount)||0) : s, 0);
                return (
                  <div className="cal-detail-summary">
                    {inc      > 0 && <span style={{color:'var(--green)'}}>+{fmt(inc)}</span>}
                    {discExp  > 0 && <span style={{color:'var(--red)'}}>−{fmt(discExp)}</span>}
                    {fixedExp > 0 && <span style={{color:'#9c6fe4'}}>⬡{fmt(fixedExp)}</span>}
                  </div>
                );
              })()}
            </div>
            {!selData
              ? <div className="cal-no-txn">Nenhuma transação neste dia.</div>
              : <div className="cal-txn-list">
                  <div className="cal-txn-hdr">
                    <span title="Ignorar">⊘</span>
                    <span title="Vinculado">⬡</span>
                    <span>Descrição</span>
                    <span>Tags</span>
                    <span>Conjunto</span>
                    <span>Categoria</span>
                    <span>Dono</span>
                    <span>Conta</span>
                    <span className="right">Valor</span>
                  </div>
                  {[...selData.txns]
                    .sort((a,b) => calSort === 'owner'
                      ? (firstName(a.owner_name) || '').localeCompare(firstName(b.owner_name) || '', 'pt-BR') || Math.abs(parseFloat(b.amount)||0) - Math.abs(parseFloat(a.amount)||0)
                      : (a.type==='CREDIT'?0:1) - (b.type==='CREDIT'?0:1) || Math.abs(parseFloat(b.amount)||0) - Math.abs(parseFloat(a.amount)||0))
                    .map(t => {
                      const isDup = calDuplicateIds.has(t.id);
                      return (
                      <div key={t.id} className={`cal-txn-row${t.ignored ? ' ignored' : ''}${t.is_fixed ? ' fixed' : ''}${isDup ? ' dup-suspect' : ''}${t.contingencia ? ' cont' : ''}`}>
                        <button className="cal-txn-ignore-btn"
                          title={t.ignored ? 'Restaurar no somatório' : 'Ignorar no somatório'}
                          onClick={() => toggleIgnored(t.id)}>
                          {t.ignored ? '↩' : '⊘'}
                        </button>
                        <button className="cal-txn-fixed-btn"
                          title={t.is_fixed ? 'Marcar como discricionário' : 'Marcar como vinculado'}
                          onClick={() => toggleFixed(t.id)}>
                          {t.is_fixed ? '⬡' : '◇'}
                        </button>
                        <div style={{display:'flex',alignItems:'center',gap:4,overflow:'hidden',minWidth:0}}>
                          {t.contingencia && (
                            <span className="tag-pill cont-mark" title="Transação de contingência — clique para desvalidar (sai dos cálculos)"
